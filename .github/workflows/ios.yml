name: ios
on:
  push:
    branches: [main]
    paths: ["ios/**", "api/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "api/**", ".github/workflows/ios.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      VERSION: ${{ inputs.version || format('0.0.0-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests (simulator)
        run: |
          # Runner images change which simulators they ship; use whichever iPhone is available.
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then echo "No iPhone simulator on this runner"; xcrun simctl list runtimes; exit 1; fi
          # Both apps: Streamero and Streamero Manage (D-048).
          for SCHEME in Streamero StreameroManage; do
            echo "::group::Test $SCHEME"
            xcodebuild test -project Streamero.xcodeproj -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,id=$UDID" \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | xcpretty
            STATUS=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          done
      - name: Build unsigned .ipa files
        run: |
          # "v0.10.1" → 0.10.1. A release's build number is derived from it (major*10000 +
          # minor*100 + patch), the same value scripts/update-feather-source.py writes as the
          # Feather source's buildVersion; other builds use the run number.
          MARKETING="${VERSION#v}"; MARKETING="${MARKETING%%-*}"
          if [ -n "${{ inputs.version }}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$MARKETING"
            BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            BUILD="${{ github.run_number }}"
          fi
          echo "Version $MARKETING, build $BUILD"
          # scheme:product:ipa name — Streamero-$VERSION.ipa keeps its name; Manage is separate.
          for SPEC in "Streamero:Streamero:Streamero" "StreameroManage:StreameroManage:Streamero-Manage"; do
            IFS=: read -r SCHEME PRODUCT IPA <<< "$SPEC"
            xcodebuild -project Streamero.xcodeproj -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              -skipPackagePluginValidation -skipMacroValidation \
              MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            rm -rf Payload && mkdir -p Payload
            cp -R "build/Build/Products/Release-iphoneos/$PRODUCT.app" Payload/
            zip -qry "$IPA-${VERSION}.ipa" Payload
          done
          ls -l *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: streamero-ipa
          path: ios/Streamero-*.ipa
