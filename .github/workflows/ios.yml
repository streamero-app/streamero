name: ios
on:
  push:
    branches: [main]
    paths: ["ios/**", "api/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "api/**", ".github/workflows/ios.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      VERSION: ${{ inputs.version || format('0.0.0-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests (simulator)
        run: |
          # Runner images change which simulators they ship; use whichever iPhone is available.
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then echo "No iPhone simulator on this runner"; xcrun simctl list runtimes; exit 1; fi
          xcodebuild test -project Streamero.xcodeproj -scheme Streamero \
            -destination "platform=iOS Simulator,id=$UDID" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | xcpretty; exit ${PIPESTATUS[0]}
      - name: Build unsigned .ipa
        run: |
          # "v0.10.1" → 0.10.1. A release's build number is derived from it (major*10000 +
          # minor*100 + patch), the same value scripts/update-feather-source.py writes as the
          # Feather source's buildVersion; other builds use the run number.
          MARKETING="${VERSION#v}"; MARKETING="${MARKETING%%-*}"
          if [ -n "${{ inputs.version }}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$MARKETING"
            BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            BUILD="${{ github.run_number }}"
          fi
          echo "Version $MARKETING, build $BUILD"
          xcodebuild -project Streamero.xcodeproj -scheme Streamero -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Streamero.app Payload/
          zip -qry "Streamero-${VERSION}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: streamero-ipa
          path: ios/Streamero-*.ipa
