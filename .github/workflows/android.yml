name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
      ANDROID_KEYSTORE_PASSWORD:
      ANDROID_KEY_ALIAS:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version of non-release builds
      - name: Version
        # versionCode = major*10000 + minor*100 + patch of the version (app/build.gradle.kts).
        # A release uses its tag; other builds the last release tag, so they never get a higher
        # code than the next release and installing that release over them works.
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"; name="${tag#v}"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            name="${tag#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=v$name" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # A tagged release must be signed with the project key (the build fails otherwise).
          REQUIRE_RELEASE_SIGNING: ${{ inputs.version && 'true' || 'false' }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk "dist/Streamero-$TAG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: streamero-apk
          path: android/dist/*.apk
