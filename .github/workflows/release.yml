name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: streamero-apk
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.apk --generate-notes --verify-tag
