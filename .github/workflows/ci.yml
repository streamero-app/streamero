name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: streamero
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: streamero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamero" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
      # Real directory for the LDAP sign-in tests (D-037); the tests add their own users.
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Example
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: admin
        ports: ["389:389"]
    env:
      STREAMERO_TEST_DB_URL: postgres://streamero:ci@localhost:5432/streamero?sslmode=disable
      STREAMERO_TEST_VALKEY_URL: redis://localhost:6379/0
      STREAMERO_TEST_LDAP_URL: ldap://localhost:389
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Generated API code is up to date
        run: |
          go tool ogen --target internal/api/gen --package gen --clean ../api/openapi.yaml
          git diff --exit-code -- internal/api/gen
          cmp ../api/openapi.yaml ../ios/Streamero/openapi.yaml
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
      - name: ffmpeg for the frame-artwork test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: go test ./... -race

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm gen:api && git diff --exit-code -- src/api/schema.gen.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-e2e/' .env
          echo "STREAMERO_SETUP_CODE=E2E-SETUP" >> .env
          # The e2e suite signs in many times from one IP; the limiter itself has unit tests.
          echo "STREAMERO_AUTH_RATE_LIMIT=1000,1000" >> .env
          docker compose -f docker-compose.yml -f compose.dev.yml build
          # Test media for the library e2e test, generated with the image's ffmpeg (short clips).
          docker run --rm --user 0 -e FIXTURE_DURATION=3 -v "$PWD/..:/w" -w /w --entrypoint bash streamero:dev \
            scripts/gen-fixtures.sh ./data/fixtures
          docker compose -f docker-compose.yml -f compose.dev.yml up -d --wait
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        env:
          E2E_SETUP_CODE: E2E-SETUP
      - name: Compose logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f compose.dev.yml logs
