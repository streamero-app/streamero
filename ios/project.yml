name: Streamero
options:
  bundleIdPrefix: net.scyde
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: "1.8.0"
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: "1.1.0"
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: "1.10.0"
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    from: "1.3.0"
targets:
  Streamero:
    type: application
    platform: iOS
    sources:
      - path: Streamero
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: HTTPTypes
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    info:
      path: Streamero/Resources/Info.plist
      properties:
        CFBundleDisplayName: Streamero
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch]
        NSLocalNetworkUsageDescription: Streamero connects to media servers on your local network.
        NSBonjourServices: [_streamero._tcp]
        # Plain http stays possible (D-057): home servers on the LAN rarely have certificates, and
        # ATS cannot be relaxed per user at run time. NSAllowsLocalNetworking is deliberately not
        # set: on iOS 10+ any such key makes iOS ignore NSAllowsArbitraryLoads. The app asks before
        # it adds a plain-http address outside the local network (ServerURL.isPlainHTTPOverInternet).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
        # Single sign-on returns through streamero://oidc (D-037). A URL scheme needs no
        # entitlement, so it survives Feather re-signing (associated domains would not).
        CFBundleURLTypes:
          - CFBundleURLName: net.scyde.streamero.sso
            CFBundleURLSchemes: [streamero]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scyde.streamero
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        # Warnings (Swift 6 concurrency included) fail the Debug build that CI tests with;
        # Release stays buildable if a newer SDK adds a deprecation warning.
        Debug:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
  # Streamero Manage: the whole app plus control of the *arr stack (D-048). Same sources,
  # plus StreameroManage/ (compiled only here) and the MANAGE compilation condition.
  StreameroManage:
    type: application
    platform: iOS
    sources:
      - path: Streamero
        # The display name and permission texts are localized per app.
        excludes: ["Resources/InfoPlist.xcstrings", "Resources/Info.plist"]
      - path: StreameroManage
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: HTTPTypes
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    info:
      path: StreameroManage/Resources/Info.plist
      properties:
        CFBundleDisplayName: Streamero Manage
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch]
        NSLocalNetworkUsageDescription: Streamero Manage connects to media servers on your local network.
        NSBonjourServices: [_streamero._tcp]
        # Same transport rules as the standard app (D-057).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
        # Own scheme so invite links and the single sign-on redirect (streamero-manage://oidc)
        # never collide with the standard app.
        CFBundleURLTypes:
          - CFBundleURLName: net.scyde.streamero.manage.links
            CFBundleURLSchemes: [streamero-manage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scyde.streamero.manage
        PRODUCT_NAME: StreameroManage
        ASSETCATALOG_COMPILER_APPICON_NAME: ManageAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MANAGE"
          SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: MANAGE
  StreameroManageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StreameroManageTests]
    dependencies:
      - target: StreameroManage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
  StreameroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StreameroTests]
    dependencies:
      - target: Streamero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Streamero:
    build:
      targets:
        Streamero: all
    test:
      targets: [StreameroTests]
  StreameroManage:
    build:
      targets:
        StreameroManage: all
    test:
      targets: [StreameroManageTests]
