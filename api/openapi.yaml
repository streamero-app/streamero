      operationId: startPlayback
      summary: Decide how to play an item on this device and get signed stream URLs
      description: |
        Returns direct play when the device supports the file as is, otherwise an HLS stream
        (remux or transcode). Stream, HLS and subtitle URLs are HMAC-signed and short-lived;
        they are served outside this API (byte ranges, HLS segments) — see D-015.
      tags: [playback]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
