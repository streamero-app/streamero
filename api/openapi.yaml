openapi: 3.1.0
info:
  title: Streamero API
  version: 0.1.0
  description: |
    Streamero media server API. This file is the single source of truth:
    server interfaces (ogen), the web client (openapi-typescript) and the iOS
    client (swift-openapi-generator) are generated from it.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: users
  - name: sessions
  - name: settings
  - name: apikeys
  - name: quickconnect
  - name: invites
  - name: profiles
  - name: libraries
  - name: items
security: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Used by clients to verify a server URL before login.
      tags: [system]
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "503":
          $ref: "#/components/responses/Starting"
        default:
          $ref: "#/components/responses/Error"
  /system/ping:
    get:
      operationId: ping
      summary: Liveness probe for clients
      tags: [system]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: create the first admin account"
      description: |
        Only allowed while `setupCompleted` is false. Requires the one-time setup code the
        server prints to its log on start (or STREAMERO_SETUP_CODE). Signs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: "Change own password; signs out all other sessions"
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTOTPSetup
      summary: Start enabling two-factor authentication
      description: Creates a new (not yet active) TOTP secret for the signed-in user.
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTOTP
      summary: Confirm a code from the authenticator app and turn 2FA on
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Enabled; one-time recovery codes (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTOTP
      summary: Turn 2FA off (requires the password)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Disabled
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/initiate:
    post:
      operationId: initiateQuickConnect
      summary: Start a Quick Connect sign-in on a new device
      description: |
        Returns a 6-digit code to show on the new device and a secret to poll with. A signed-in
        user approves the code (POST /quickconnect/authorize) within 5 minutes.
      tags: [quickconnect]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200":
          description: Code and polling secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStart"
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/poll:
    post:
      operationId: pollQuickConnect
      summary: Check whether the code was approved; signs the device in when it was
      tags: [quickconnect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickConnectPollRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "202":
          description: Not approved yet; poll again in a few seconds.
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/authorize:
    post:
      operationId: authorizeQuickConnect
      summary: Approve a Quick Connect code shown on another device
      description: The other device is signed in as the calling user.
      tags: [quickconnect]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectApproved"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (admin)
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update a user (admin)
      description: Disabling a user or changing the password signs out all of their sessions.
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user and all of their sessions (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      operationId: listSessions
      summary: Signed-in devices
      description: Own sessions; admins see the sessions of all users.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameSession
      summary: Rename a signed-in device
      description: Own sessions; admins can rename any session.
      tags: [sessions]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeSession
      summary: Sign a device out immediately
      description: Own sessions; admins can revoke any session.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /apikeys:
    get:
      operationId: listAPIKeys
      summary: API keys for integrations (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "200":
          description: API keys (the secret is never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin)
      description: |
        The key acts with the rights of the admin who created it and is deleted with that
        user. Send it as `Authorization: Bearer <key>`. The secret is returned only once.
      tags: [apikeys]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /apikeys/{apiKeyId}:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAPIKey
      summary: Revoke an API key immediately (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invites:
    get:
      operationId: listInvites
      summary: Invite links (admin)
      tags: [invites]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Invites (tokens are never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [invites]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created; the token is shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        default:
          $ref: "#/components/responses/Error"
  /invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [invites]
      security:
        - sessionToken: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invite/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getInvite
      summary: Check an invite link (public)
      tags: [invites]
      responses:
        "200":
          description: The invite is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: acceptInvite
      summary: Create an account from an invite and sign in (public)
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      operationId: listProfiles
      summary: Profiles of the signed-in user
      description: The account itself is the main profile; these are additional profiles (max 6).
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProfile
      summary: Add a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: updateProfile
      summary: Change a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      summary: Delete a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/select:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: selectProfile
      summary: Switch this device to a profile (PIN if the profile has one)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /profiles/main/select:
    post:
      operationId: selectMainProfile
      summary: Switch this device back to the main profile
      description: From a kids profile this needs the account password.
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      operationId: listLibraries
      summary: Libraries the caller may see
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibrary
      summary: Add a library and start scanning it (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    put:
      operationId: updateLibrary
      summary: Change a library (admin); changed folders are rescanned
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Remove a library from Streamero (admin). Media files are never touched.
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: scanLibrary
      summary: Scan a library for new, changed and removed files (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Scan queued
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort
        in: query
        schema:
          type: string
          enum: [title, year, added]
          default: title
    get:
      operationId: listLibraryItems
      summary: Top-level items of a library (movies, series), paged
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getItem
      summary: An item with its files and children (seasons/episodes)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /fs/directories:
    get:
      operationId: browseDirectories
      summary: Sub-folders of a media folder, for choosing library folders (admin)
      description: Without `path`, returns the configured media roots.
      tags: [libraries]
      security:
        - sessionToken: []
      parameters:
        - name: path
          in: query
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        default:
          $ref: "#/components/responses/Error"
  /settings/server:
    get:
      operationId: getServerSettings
      summary: Server-wide settings (admin)
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateServerSettings
      summary: Update server-wide settings (admin)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token from /auth/login or /setup, or an API key (`sk_…`) from /apikeys.
        Web clients get the session as the HttpOnly `streamero_session` cookie instead
        (useCookie: true), which the server accepts too.
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Starting:
      description: Server is starting; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        serverName:
          type: string
          maxLength: 100
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 32
          description: |
            Required when the user has 2FA on: a 6-digit code or a recovery code. Without it the
            server answers 401 `totp_required` (the password was correct, nothing else is revealed).
        useCookie:
          type: boolean
          description: Web clients set this to receive an HttpOnly cookie instead of a token.
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Safari on iPhone"
        client:
          type: string
          maxLength: 100
          description: e.g. "Streamero Web 0.1.0"
    AuthResult:
      type: object
      required: [user, sessionId]
      properties:
        token:
          type: string
          description: Bearer token. Omitted when useCookie was requested.
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Invite:
      type: object
      required: [id, note, createdBy, createdAt, expiresAt, maxUses, uses, permissions]
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        uses:
          type: integer
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreateInviteRequest:
      type: object
      required: [expiresInHours, maxUses]
      properties:
        note:
          type: string
          maxLength: 100
          description: e.g. "For my sister"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreatedInvite:
      type: object
      required: [token, invite]
      properties:
        token:
          type: string
          description: Goes into the link /invite/<token>. Shown only once.
        invite:
          $ref: "#/components/schemas/Invite"
    InviteInfo:
      type: object
      required: [serverName, expiresAt]
      properties:
        serverName:
          type: string
        expiresAt:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    QuickConnectStart:
      type: object
      required: [code, secret, expiresAt]
      properties:
        code:
          type: string
          description: 6 digits, shown on the new device.
        secret:
          type: string
          description: Kept on the new device and sent to /quickconnect/poll.
        expiresAt:
          type: string
          format: date-time
    QuickConnectPollRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 128
        useCookie:
          type: boolean
    QuickConnectApproved:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
    LibraryKind:
      type: string
      enum: [movies, shows, music, mixed]
    LibraryInput:
      type: object
      required: [name, kind, paths]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 4096
    Library:
      type: object
      required: [id, name, kind, paths, itemCount, scan]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          items:
            type: string
        itemCount:
          type: integer
        scan:
          $ref: "#/components/schemas/ScanStatus"
    ScanStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, queued, scanning, failed]
        lastScanAt:
          type: string
          format: date-time
        error:
          type: string
        filesSeen:
          type: integer
    ItemKind:
      type: string
      enum: [movie, series, season, episode]
    ItemSummary:
      type: object
      required: [id, kind, title, addedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeNumberEnd:
          type: integer
        durationMs:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
    ItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
    MediaFile:
      type: object
      required: [id, path, size, container]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Path inside the server's media folders.
        label:
          type: string
          description: Version label from the file name, e.g. "4K" or "Director's Cut".
        size:
          type: integer
          format: int64
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdr:
          type: string
          description: e.g. "HDR10", "HLG", "Dolby Vision" (empty for SDR).
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleStream"
    AudioStream:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
        language:
          type: string
        channels:
          type: integer
        title:
          type: string
    SubtitleStream:
      type: object
      required: [codec, external]
      properties:
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
    ItemDetail:
      type: object
      required: [item, libraryId, files, children, providerIds]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        libraryId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        providerIds:
          type: object
          additionalProperties:
            type: string
          description: "Provider IDs from file/folder names, e.g. tmdb=603, imdb=tt0133093."
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFile"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    DirectoryListing:
      type: object
      required: [directories]
      properties:
        path:
          type: string
          description: The listed folder (absent for the list of media roots).
        parent:
          type: string
        directories:
          type: array
          items:
            type: string
          description: Absolute paths of sub-folders.
    Profile:
      type: object
      required: [id, name, color, hasPin, isKid]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Avatar colour, e.g. "#e5484d".
        hasPin:
          type: boolean
        isKid:
          type: boolean
        maxRating:
          type: integer
          description: Highest age rating allowed (e.g. 12); applies from P3 (ratings) on.
    ProfileInput:
      type: object
      required: [name, color, isKid]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        isKid:
          type: boolean
        maxRating:
          type: integer
          minimum: 0
          maximum: 21
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          description: Set or change the PIN. Omit to keep it; see removePin.
        removePin:
          type: boolean
    PinRequest:
      type: object
      properties:
        pin:
          type: string
          maxLength: 6
    TOTPSetup:
      type: object
      required: [secret, otpauthUri, qrPng]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: otpauth:// link; opens the authenticator app on phones.
        qrPng:
          type: string
          description: The otpauth URI as a QR code (PNG, base64).
    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    PasswordConfirmRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    UserPermissions:
      type: object
      description: |
        What a non-admin may do (admins may do everything). Each permission is enforced by the
        feature it belongs to as that feature ships (libraries P2, playback P5, Live TV P11, ...).
      required: [allLibraries, download, videoTranscoding, audioTranscoding, remux, liveTv, manageLiveTv,
        syncPlay, deleteMedia, manageCollections, editSubtitles, remoteControl, maxSessions]
      properties:
        allLibraries:
          type: boolean
        download:
          type: boolean
        videoTranscoding:
          type: boolean
        audioTranscoding:
          type: boolean
        remux:
          type: boolean
        liveTv:
          type: boolean
        manageLiveTv:
          type: boolean
        syncPlay:
          type: boolean
        deleteMedia:
          type: boolean
        manageCollections:
          type: boolean
        editSubtitles:
          type: boolean
        remoteControl:
          type: boolean
        maxSessions:
          type: integer
          minimum: 0
          maximum: 100
          description: Signed-in devices allowed at once; 0 = unlimited. Signing in on one more device signs out the least recently used one.
    User:
      type: object
      required: [id, username, isAdmin, disabled, totpEnabled, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
          description: Two-factor authentication is on.
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        currentProfile:
          $ref: "#/components/schemas/Profile"
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        isAdmin:
          type: boolean
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    UpdateUserRequest:
      type: object
      properties:
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        password:
          $ref: "#/components/schemas/Password"
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        resetTwoFactor:
          type: boolean
          description: Turn the user's 2FA off (e.g. lost phone); signs them out everywhere.
    Session:
      type: object
      required: [id, userId, username, deviceName, client, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        deviceName:
          type: string
        client:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    RenameSessionRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First characters of the key, to recognise it.
        createdBy:
          type: string
          description: Username of the admin who created the key.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: e.g. "Jellyseerr"
    CreatedApiKey:
      type: object
      required: [key, apiKey]
      properties:
        key:
          type: string
          description: The secret. Shown only once.
        apiKey:
          $ref: "#/components/schemas/ApiKey"
    ServerSettings:
      type: object
      required: [serverName]
      properties:
        serverName:
          type: string
          minLength: 1
          maxLength: 100
    Pong:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SystemInfo:
      type: object
      required: [id, name, product, version, apiVersion, setupCompleted, startedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable server identifier, generated on first start.
        name:
          type: string
          description: Human readable server name.
        product:
          type: string
          description: Always "Streamero".
        version:
          type: string
        commit:
          type: string
        apiVersion:
          type: string
        setupCompleted:
          type: boolean
        startedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
