      summary: One sheet of seek-bar thumbnails (JPEG grid)
      tags: [playback]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}:
