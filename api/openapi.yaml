                $ref: "#/components/schemas/LiveTvGuideSource"
        default:
          $ref: "#/components/responses/Error"
  /livetv/guides/test:
    post:
      operationId: testLiveTvGuide
      summary: Check an XMLTV source without saving it (manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveTvGuideSourceInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvTestResult"
        default:
          $ref: "#/components/responses/Error"
  /livetv/guides/{guideId}:
    parameters:
      - name: guideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateLiveTvGuide
      summary: Change an XMLTV guide source (manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveTvGuideSourceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvGuideSource"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLiveTvGuide
      summary: Remove an XMLTV guide source and its programmes (manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /livetv/guides/{guideId}/refresh:
    parameters:
      - name: guideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: refreshLiveTvGuide
      summary: Reload a guide source now (queued; manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /livetv/mapping:
    get:
      operationId: getLiveTvMapping
      summary: Every channel with its guide mapping, and the guide channels to map to (manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvMapping"
        default:
          $ref: "#/components/responses/Error"
  /livetv/settings:
    get:
      operationId: getLiveTvSettings
      summary: DVR and time-shift settings (manageLiveTv)
      tags: [livetv]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateLiveTvSettings
      summary: Change DVR and time-shift settings (manageLiveTv; the post-processing command only by administrators)
      tags: [livetv]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveTvSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvSettings"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token from /auth/login or /setup, or an API key (`sk_…`) from /apikeys.
        Web clients get the session as the HttpOnly `streamero_session` cookie instead
        (useCookie: true), which the server accepts too.
  parameters:
    OidcProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupName:
      name: backupName
      in: path
      required: true
      description: File name of a backup in the backup folder.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,180}\\.tar\\.gz$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    OidcRedirect:
      description: Redirect (to the provider, the web client or the app)
      headers:
        Location:
          required: true
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Starting:
      description: Server is starting; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        serverName:
          type: string
          maxLength: 100
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 32
          description: |
            Required when the user has 2FA on: a 6-digit code or a recovery code. Without it the
            server answers 401 `totp_required` (the password was correct, nothing else is revealed).
        useCookie:
          type: boolean
          description: Web clients set this to receive an HttpOnly cookie instead of a token.
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Safari on iPhone"
        client:
          type: string
          maxLength: 100
          description: e.g. "Streamero Web 0.1.0"
    AuthResult:
      type: object
      required: [user, sessionId]
      properties:
        token:
          type: string
          description: Bearer token. Omitted when useCookie was requested.
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    AuthProviders:
      type: object
      required: [passwordLogin, ldap, oidc]
      properties:
        passwordLogin:
          type: boolean
          description: Username/password sign-in is offered (local accounts or LDAP).
        ldap:
          type: boolean
          description: Directory (LDAP) accounts sign in with the username/password fields.
        oidc:
          type: array
          items:
            $ref: "#/components/schemas/OidcProviderButton"
    OidcProviderButton:
      type: object
      required: [id, label, authorizeUrl]
      properties:
        id:
          type: string
        label:
          type: string
        authorizeUrl:
          type: string
          description: Absolute URL of /auth/oidc/{id}/authorize on the server's public address.
    OidcExchangeRequest:
      type: object
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          maxLength: 128
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
        device:
          $ref: "#/components/schemas/DeviceInfo"
    OidcLinkStart:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
    LinkedIdentities:
      type: object
      required: [hasPassword, identities]
      properties:
        hasPassword:
          type: boolean
          description: The account has a local password.
        identities:
          type: array
          items:
            $ref: "#/components/schemas/LinkedIdentity"
    LinkedIdentity:
      type: object
      required: [id, kind, providerId, providerLabel, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [oidc, ldap]
        providerId:
          type: string
          description: The OIDC provider id; empty for LDAP.
        providerLabel:
          type: string
        label:
          type: string
          description: E-mail or name at the provider, for display.
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    AuthSettings:
      type: object
      required: [publicUrl, disablePasswordLogin, recoveryActive]
      properties:
        publicUrl:
          type: string
          description: Address users reach the server at, e.g. https://media.example.com. Needed for single sign-on.
        disablePasswordLogin:
          type: boolean
        recoveryActive:
          type: boolean
          description: STREAMERO_PASSWORD_LOGIN_RECOVERY is set, so administrators can sign in with a password.
    AuthSettingsInput:
      type: object
      required: [publicUrl, disablePasswordLogin]
      properties:
        publicUrl:
          type: string
          maxLength: 300
        disablePasswordLogin:
          type: boolean
    OidcProvider:
      type: object
      required: [id, label, issuer, clientId, clientSecretSet, scopes, usernameClaim, emailClaim, nameClaim, groupsClaim,
        adminGroup, allowedGroup, autoCreate, linkByEmail, trustEmail, enabled, redirectUri]
      properties:
        id:
          type: string
        label:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecretSet:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        usernameClaim:
          type: string
        emailClaim:
          type: string
        nameClaim:
          type: string
        groupsClaim:
          type: string
        adminGroup:
          type: string
        allowedGroup:
          type: string
        autoCreate:
          type: boolean
        linkByEmail:
          type: boolean
        trustEmail:
          type: boolean
        enabled:
          type: boolean
        redirectUri:
          type: string
          description: The exact redirect URI to register at the provider (empty until the public URL is set).
    OidcProviderInput:
      type: object
      required: [id, label, issuer, clientId]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
          description: Part of the redirect URI; cannot be changed later.
        label:
          type: string
          minLength: 1
          maxLength: 60
        issuer:
          type: string
          maxLength: 300
        clientId:
          type: string
          minLength: 1
          maxLength: 300
        clientSecret:
          type: string
          maxLength: 1000
          description: Empty or omitted keeps the stored secret (or none for a public client).
        removeClientSecret:
          type: boolean
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        usernameClaim:
          type: string
          maxLength: 100
        emailClaim:
          type: string
          maxLength: 100
        nameClaim:
          type: string
          maxLength: 100
        groupsClaim:
          type: string
          maxLength: 100
        adminGroup:
          type: string
          maxLength: 300
        allowedGroup:
          type: string
          maxLength: 300
        autoCreate:
          type: boolean
        linkByEmail:
          type: boolean
        trustEmail:
          type: boolean
        enabled:
          type: boolean
    OidcTestRequest:
      type: object
      required: [issuer]
      properties:
        issuer:
          type: string
          maxLength: 300
    OidcTestResult:
      type: object
      required: [issuer, authorizationEndpoint, tokenEndpoint, signingKeys, pkceS256]
      properties:
        issuer:
          type: string
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        userinfoEndpoint:
          type: string
        signingKeys:
          type: integer
          description: Number of keys in the provider's JWKS.
        pkceS256:
          type: boolean
          description: The provider advertises PKCE S256 (when it says nothing, PKCE is still sent).
        scopesSupported:
          type: array
          items:
            type: string
    LdapSettings:
      type: object
      required: [enabled, url, startTls, skipVerify, caCert, bindDn, bindPasswordSet, baseDn, userFilter, usernameAttribute,
        emailAttribute, nameAttribute, groupAttribute, groupFilter, adminGroup, allowedGroup]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          description: ldaps://host:636 or ldap://host:389
        startTls:
          type: boolean
        skipVerify:
          type: boolean
          description: Do not verify the server certificate (unsafe; for testing only).
        caCert:
          type: string
          description: PEM certificate(s) trusted in addition to the system roots.
        bindDn:
          type: string
        bindPasswordSet:
          type: boolean
        baseDn:
          type: string
        userFilter:
          type: string
          description: Search filter with {username}, e.g. (&(objectClass=inetOrgPerson)(uid={username})).
        usernameAttribute:
          type: string
        emailAttribute:
          type: string
        nameAttribute:
          type: string
        groupAttribute:
          type: string
          description: User attribute that lists group DNs (memberOf). Used when groupFilter is empty.
        groupFilter:
          type: string
          description: Optional group search filter with {dn} and/or {username}, e.g. (member={dn}).
        adminGroup:
          type: string
          description: Group DN whose members are administrators (empty = admin status is managed in Streamero).
        allowedGroup:
          type: string
          description: Group DN required to sign in (empty = any user the filter finds).
    LdapSettingsInput:
      type: object
      required: [enabled, url, startTls, skipVerify, baseDn, userFilter]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 300
        startTls:
          type: boolean
        skipVerify:
          type: boolean
        caCert:
          type: string
          maxLength: 20000
        bindDn:
          type: string
          maxLength: 500
        bindPassword:
          type: string
          maxLength: 500
          description: Empty or omitted keeps the stored password.
        removeBindPassword:
          type: boolean
        baseDn:
          type: string
          maxLength: 500
        userFilter:
          type: string
          maxLength: 500
        usernameAttribute:
          type: string
          maxLength: 100
        emailAttribute:
          type: string
          maxLength: 100
        nameAttribute:
          type: string
          maxLength: 100
        groupAttribute:
          type: string
          maxLength: 100
        groupFilter:
          type: string
          maxLength: 500
        adminGroup:
          type: string
          maxLength: 500
        allowedGroup:
          type: string
          maxLength: 500
    LdapTestRequest:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/LdapSettingsInput"
        username:
          type: string
          maxLength: 64
          description: Look this user up (no password is checked).
    LdapTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        userDn:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        groups:
          type: array
          items:
            type: string
        isAdmin:
          type: boolean
        allowed:
          type: boolean
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Invite:
      type: object
      required: [id, note, createdBy, createdAt, expiresAt, maxUses, uses, permissions]
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        uses:
          type: integer
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreateInviteRequest:
      type: object
      required: [expiresInHours, maxUses]
      properties:
        note:
          type: string
          maxLength: 100
          description: e.g. "For my sister"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreatedInvite:
      type: object
      required: [token, invite]
      properties:
        token:
          type: string
          description: Goes into the link /invite/<token>. Shown only once.
        invite:
          $ref: "#/components/schemas/Invite"
    InviteInfo:
      type: object
      required: [serverName, expiresAt]
      properties:
        serverName:
          type: string
        expiresAt:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    QuickConnectStart:
      type: object
      required: [code, secret, expiresAt]
      properties:
        code:
          type: string
          description: 6 digits, shown on the new device.
        secret:
          type: string
          description: Kept on the new device and sent to /quickconnect/poll.
        expiresAt:
          type: string
          format: date-time
    QuickConnectPollRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 128
        useCookie:
          type: boolean
    QuickConnectApproved:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
    LibraryKind:
      type: string
      enum: [movies, shows, music, mixed]
    LibraryInput:
      type: object
      required: [name, kind, paths]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 4096
    Library:
      type: object
      required: [id, name, kind, paths, itemCount, scan]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          items:
            type: string
        itemCount:
          type: integer
        scan:
          $ref: "#/components/schemas/ScanStatus"
    ScanStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, queued, scanning, failed]
        lastScanAt:
          type: string
          format: date-time
        error:
          type: string
        filesSeen:
          type: integer
        heldRemovals:
          type: integer
          description: >-
            Missing files the last scan kept because removing them looked like an offline or
            half-mounted folder; scan with confirmRemoval to remove them.
    ItemKind:
      type: string
      enum: [movie, series, season, episode, artist, album, track]
    DeviceProfile:
      type: object
      description: What the client can decode natively.
      required: [containers, videoCodecs, audioCodecs]
      properties:
        containers:
          type: array
          items:
            type: string
          description: e.g. ["mp4", "webm"]
        videoCodecs:
          type: array
          items:
            type: string
          description: ffprobe codec names, e.g. ["h264", "hevc", "av1", "vp9"]
        audioCodecs:
          type: array
          items:
            type: string
          description: e.g. ["aac", "mp3", "opus", "flac", "ac3", "eac3"]
        hls:
          type: boolean
          description: The client plays HLS with fMP4 segments.
        maxHeight:
          type: integer
        maxBitrate:
          type: integer
          description: Bits per second; lower values force transcoding.
        subtitleCodecs:
          type: array
          items:
            type: string
          description: >-
            Bitmap subtitle formats the client draws itself when it plays the file directly
            (ffprobe names, e.g. ["hdmv_pgs_subtitle", "dvd_subtitle"]). Other bitmap tracks
            are burned into the picture when chosen. Text tracks are always offered as WebVTT.
    PlaybackRequest:
      type: object
      required: [device]
      properties:
        fileId:
          type: string
          format: uuid
          description: Version to play (default the best one).
        audioIndex:
          type: integer
          description: Index into the file's audio tracks (default the first).
        startMs:
          type: integer
          format: int64
          description: Start position (default the saved resume position).
        subtitleIndex:
          type: integer
          description: >-
            Subtitle track chosen by the viewer (index into the file's subtitle tracks; -1 = none).
            A bitmap track (PGS, VobSub, DVB) the client cannot draw is burned into the picture,
            which makes the stream a transcode. Absent = automatic: a forced bitmap track picked
            by the viewer's subtitle preference is burned in.
        burnSubtitle:
          type: boolean
          description: Burn the chosen subtitleIndex in even when it is a text track (keeps ASS/SSA styling).
        device:
          $ref: "#/components/schemas/DeviceProfile"
    PlaybackInfo:
      type: object
      required: [fileId, method, url, startMs, subtitles, audio]
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MediaSegment"
        trickplay:
          $ref: "#/components/schemas/TrickplayInfo"
        subtitleDefault:
          type: integer
          description: Position in subtitles to show by default (from the viewer's preferences); absent = off.
        fileId:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct, remux, transcode]
        url:
          type: string
          description: Signed URL (relative to the server) for the video element / player.
        startMs:
          type: integer
          format: int64
          description: Position the stream starts at; for HLS the stream itself starts there.
        durationMs:
          type: integer
          format: int64
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        audioIndex:
          type: integer
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSubtitle"
        reason:
          type: string
          description: Why the stream is not direct play (e.g. "audio codec dts", "subtitle burn-in").
        bitmapSubtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackBitmapSubtitle"
          description: Bitmap subtitle tracks; choosing one restarts playback with subtitleIndex (burned in).
        burnedSubtitle:
          type: integer
          description: Index of the subtitle track burned into this stream (absent = none).
    PlaybackBitmapSubtitle:
      type: object
      required: [index, codec]
      properties:
        index:
          type: integer
          description: Index into the file's subtitle tracks (the value for subtitleIndex).
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
    PlaybackSubtitle:
      type: object
      required: [index, url, external]
      properties:
        index:
          type: integer
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
        url:
          type: string
          description: Signed WebVTT URL.
    UserDataUpdate:
      type: object
      properties:
        favorite:
          type: boolean
        played:
          type: boolean
    ProgressReport:
      type: object
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
        played:
          type: boolean
          description: Mark as watched (set automatically past 90%).
    DownloadQuality:
      type: string
      enum: [original, source, 1080p, 720p]
      description: |
        `original` is the file as it is; the others are an MP4 with H.264 video and AAC stereo
        audio: `source` keeps the resolution, `1080p` is at most 1080 lines and ~5 Mbit/s,
        `720p` at most 720 lines and ~2 Mbit/s.
    DownloadRequest:
      type: object
      required: [itemId, quality]
      properties:
        itemId:
          type: string
          format: uuid
          description: A movie, episode, season or series.
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        fileId:
          type: string
          format: uuid
          description: Version of a movie or episode (default the best one).
        audioIndex:
          type: integer
          minimum: 0
          description: Audio track for transcoded qualities (default from the profile's preference).
        nextEpisodes:
          type: integer
          minimum: 1
          maximum: 50
          description: For a series or season, only the next N unwatched episodes.
        skipItemIds:
          type: array
          maxItems: 500
          description: Episodes the device already has; they are left out of a season or series.
          items:
            type: string
            format: uuid
    DownloadSubtitle:
      type: object
      required: [index, language, forced, url, vttUrl]
      properties:
        index:
          type: integer
          description: Position in the file's subtitle list.
        language:
          type: string
        forced:
          type: boolean
        url:
          type: string
          description: Signed SubRip (.srt) sidecar.
        vttUrl:
          type: string
          description: Signed WebVTT sidecar.
    Download:
      type: object
      required: [id, itemId, fileId, quality, state, progress, createdAt, item, subtitles]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        state:
          type: string
          enum: [queued, transcoding, ready, failed]
        progress:
          type: number
          description: Transcoding progress 0–1 (1 when ready).
        sizeBytes:
          type: integer
          format: int64
          description: Size of the file to fetch (known when ready).
        error:
          type: string
        url:
          type: string
          description: Signed URL of the file (byte ranges supported), only when ready.
        urlExpiresAt:
          type: string
          format: date-time
        fileName:
          type: string
        container:
          type: string
          description: File extension of the downloaded file (mp4 for transcodes).
        durationMs:
          type: integer
          format: int64
        audioIndex:
          type: integer
        subtitles:
          type: array
          description: Text subtitle tracks as sidecars (picture subtitles are not offered).
          items:
            $ref: "#/components/schemas/DownloadSubtitle"
        item:
          $ref: "#/components/schemas/ItemSummary"
        overview:
          type: string
        series:
          $ref: "#/components/schemas/ItemSummary"
        createdAt:
          type: string
          format: date-time
    OfflineProgress:
      type: object
      required: [itemId, positionMs, played, updatedAt]
      properties:
        itemId:
          type: string
          format: uuid
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
        played:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          description: When this state was recorded on the device.
    OfflineSyncRequest:
      type: object
      required: [itemIds, progress]
      properties:
        itemIds:
          type: array
          maxItems: 2000
          description: Items the device keeps offline.
          items:
            type: string
            format: uuid
        progress:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/OfflineProgress"
    OfflineItemState:
      type: object
      required: [itemId, positionMs, played, updatedAt]
      properties:
        itemId:
          type: string
          format: uuid
        positionMs:
          type: integer
          format: int64
        played:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    OfflineSyncResponse:
      type: object
      required: [revoked, items, applied]
      properties:
        revoked:
          type: array
          description: Items the profile may no longer keep offline.
          items:
            type: string
            format: uuid
        items:
          type: array
          description: Server state of the listed items (never-played items are left out).
          items:
            $ref: "#/components/schemas/OfflineItemState"
        applied:
          type: integer
          description: How many offline reports were newer than the server's state and were saved.
    OriginalLinkRequest:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
          description: Version to download (default the best one).
    OriginalLink:
      type: object
      required: [url, fileName, sizeBytes]
      properties:
        url:
          type: string
          description: Signed URL that downloads the file (Content-Disposition attachment).
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
    DownloadSettings:
      type: object
      required: [maxTranscodes, cacheLimitGb, keepDays]
      properties:
        maxTranscodes:
          type: integer
          minimum: 1
          maximum: 16
          description: Download transcodes running at once; more wait in the queue.
        cacheLimitGb:
          type: integer
          minimum: 1
          maximum: 100000
          description: Size of the download cache; the least recently fetched files go first.
        keepDays:
          type: integer
          minimum: 1
          maximum: 90
          description: A transcoded file nobody fetched for this long is deleted.
    DownloadTranscode:
      type: object
      required: [id, itemId, title, quality, state, progress, sizeBytes, jobs, users, createdAt, lastAccessAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        title:
          type: string
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        state:
          type: string
          enum: [queued, transcoding, ready, failed]
        progress:
          type: number
        sizeBytes:
          type: integer
          format: int64
        error:
          type: string
        jobs:
          type: integer
          description: Download jobs that use this file.
        users:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastAccessAt:
          type: string
          format: date-time
    DownloadAdmin:
      type: object
      required: [settings, running, queued, cacheBytes, transcodes]
      properties:
        settings:
          $ref: "#/components/schemas/DownloadSettings"
        running:
          type: integer
        queued:
          type: integer
        cacheBytes:
          type: integer
          format: int64
        transcodes:
          type: array
          items:
            $ref: "#/components/schemas/DownloadTranscode"
    Dashboard:
      type: object
      required: [server, storage, nowPlaying, activeTranscodes, activity]
      properties:
        server:
          type: object
          required: [name, version, startedAt, os]
          properties:
            name:
              type: string
            version:
              type: string
            commit:
              type: string
            os:
              type: string
            startedAt:
              type: string
              format: date-time
        storage:
          type: array
          items:
            $ref: "#/components/schemas/StorageUsage"
        nowPlaying:
          type: array
          items:
            $ref: "#/components/schemas/NowPlaying"
        activeTranscodes:
          type: integer
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
    StorageUsage:
      type: object
      required: [kind, path, totalBytes, freeBytes]
      properties:
        kind:
          type: string
          enum: [media, cache, transcode]
        path:
          type: string
        totalBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
    NowPlaying:
      type: object
      required: [key, user, device, itemId, title, method, positionMs, updatedAt]
      properties:
        key:
          type: string
          description: Identifies the playing session for remote commands.
        user:
          type: string
        profile:
          type: string
        device:
          type: string
        client:
          type: string
        itemId:
          type: string
          format: uuid
        title:
          type: string
        method:
          type: string
          enum: [direct, remux, transcode]
        reason:
          type: string
          description: Why the server remuxes or transcodes.
        positionMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ActivityEntry:
      type: object
      required: [at, action]
      properties:
        at:
          type: string
          format: date-time
        user:
          type: string
        action:
          type: string
          description: Machine-readable event (login.succeeded, user.created…).
        detail:
          type: object
          additionalProperties: true
    TaskKey:
      type: string
      enum: [scan_all, refresh_metadata, cleanup_images, analyze_media, detect_segments, backup, refresh_guide]
    Task:
      type: object
      required: [key, running]
      properties:
        key:
          $ref: "#/components/schemas/TaskKey"
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastState:
          type: string
          description: completed, failed or cancelled.
        interval:
          type: string
          description: Automatic schedule, e.g. "6h"; absent when manual only.
    BackupKind:
      type: string
      enum: [scheduled, manual, pre_restore, uploaded]
    Backup:
      type: object
      required: [name, sizeBytes, createdAt, kind, serverVersion, schemaVersion, includesImages, scanRunning, restorable]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/BackupKind"
        serverVersion:
          type: string
        schemaVersion:
          type: integer
          format: int64
        includesImages:
          type: boolean
        scanRunning:
          type: boolean
          description: A library scan was running while the backup was taken.
        restorable:
          type: boolean
          description: False when the archive is unreadable or from a newer database schema than this server.
        problem:
          type: string
          description: Why the backup cannot be restored (unreadable, newer_schema).
        skippedTables:
          type: array
          description: Tables that could not be read when the backup was taken (damaged rows).
          items:
            type: string
    BackupSettings:
      type: object
      required: [enabled, keepLast, includeImages]
      properties:
        enabled:
          type: boolean
          description: Write a backup automatically once a day.
        keepLast:
          type: integer
          minimum: 1
          maximum: 100
          description: Scheduled and manual backups kept; older ones are deleted.
        includeImages:
          type: boolean
          description: Also archive downloaded artwork (it can be fetched again, so it is off by default).
    RestoreStatus:
      type: object
      required: [backup, state, startedAt]
      properties:
        backup:
          type: string
        state:
          type: string
          enum: [running, succeeded, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        safetyBackup:
          type: string
          description: Backup of the state just before the restore.
        warnings:
          type: array
          items:
            type: string
    BackupOverview:
      type: object
      required: [dir, backups, settings, scanRunning, running, schemaVersion]
      properties:
        dir:
          type: string
          description: Backup folder inside the server container.
        backups:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        settings:
          $ref: "#/components/schemas/BackupSettings"
        scanRunning:
          type: boolean
          description: A library scan is running now.
        running:
          type: boolean
          description: A backup is queued or being written.
        schemaVersion:
          type: integer
          format: int64
          description: Newest database schema this server knows.
        lastRestore:
          $ref: "#/components/schemas/RestoreStatus"
    BackupQueued:
      type: object
      required: [scanRunning]
      properties:
        scanRunning:
          type: boolean
          description: A library scan is running; the backup is still consistent but may miss items being added.
    RestoreBackupRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must repeat the backup name exactly.
    NotificationEvent:
      type: string
      enum: [item.added, playback.started, login.succeeded, login.failed, scan.failed, test]
    NotificationTarget:
      type: object
      required: [id, name, kind, url, events, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [generic, discord, ntfy, gotify]
        url:
          type: string
          format: uri
          maxLength: 2000
        token:
          type: string
          maxLength: 500
          description: Write-only (ntfy access token, Gotify app token).
        hasToken:
          type: boolean
          readOnly: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEvent"
        enabled:
          type: boolean
    NotificationSettings:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/NotificationTarget"
    PlaybackPreferences:
      type: object
      required: [subtitleMode, autoplayNext]
      properties:
        audioLanguage:
          type: string
          maxLength: 3
          description: Preferred audio language (ISO 639-1 or -2, e.g. "hr", "eng"); empty = the file's default track.
        subtitleLanguage:
          type: string
          maxLength: 3
          description: Preferred subtitle language.
        subtitleMode:
          type: string
          enum: [default, smart, always, forced, none]
          description: >-
            default: forced subtitles in the audio language, else the preferred language when the audio differs;
            smart: the preferred language only when the audio is in another language; always: the preferred language;
            forced: forced subtitles only; none: off.
        autoplayNext:
          type: boolean
          description: Play the next episode automatically.
        skipBackSeconds:
          type: integer
          minimum: 5
          maximum: 60
        skipForwardSeconds:
          type: integer
          minimum: 5
          maximum: 120
        maxBitrateKbps:
          type: integer
          minimum: 0
          maximum: 200000
          description: Streaming limit for this profile; 0 = no limit.
        maxHeight:
          type: integer
          minimum: 0
          maximum: 4320
          description: Highest picture height to stream (e.g. 1080); 0 = original.
        upNextSeconds:
          type: integer
          minimum: 0
          maximum: 60
          description: Countdown before the next episode; 0 = show the card without counting down.
        skipIntro:
          type: string
          enum: [button, auto, off]
        skipCredits:
          type: string
          enum: [button, auto, off]
        subtitleSize:
          type: string
          enum: [small, normal, large, xlarge]
        subtitleColor:
          type: string
          enum: [white, yellow, cyan]
        subtitleBackground:
          type: string
          enum: [none, shadow, box]
        subtitlePosition:
          type: integer
          minimum: 0
          maximum: 40
          description: Lift from the bottom edge, in percent of the picture height.
        homeSections:
          type: array
          description: Order and visibility of the sections on the home page.
          maxItems: 12
          items:
            type: string
            enum: [continue, nextUp, latest, favorites, collections, top, genres, libraries]
    Collection:
      type: object
      required: [id, name, itemCount, hasPoster, hasBackdrop, auto]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        overview:
          type: string
        itemCount:
          type: integer
        hasPoster:
          type: boolean
        hasBackdrop:
          type: boolean
        auto:
          type: boolean
          description: Created from TMDb (box set); kept in sync by metadata refresh.
    CollectionDetail:
      type: object
      required: [collection, items]
      properties:
        collection:
          $ref: "#/components/schemas/Collection"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    CollectionInput:
      type: object
      required: [name, itemIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        overview:
          type: string
          maxLength: 2000
        itemIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    Playlist:
      type: object
      required: [id, name, itemCount, public, mine, durationMs]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        itemCount:
          type: integer
        durationMs:
          type: integer
          format: int64
        public:
          type: boolean
        mine:
          type: boolean
          description: The current profile owns it (may edit).
        coverItemIds:
          type: array
          description: Up to four items whose artwork makes the cover.
          items:
            type: string
            format: uuid
    PlaylistDetail:
      type: object
      required: [playlist, items]
      properties:
        playlist:
          $ref: "#/components/schemas/Playlist"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    PlaylistInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        public:
          type: boolean
        itemIds:
          type: array
          maxItems: 500
          description: Full order on update; omitted keeps the items.
          items:
            type: string
            format: uuid
    IdentifyResult:
      type: object
      required: [tmdbId, title]
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        originalTitle:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterUrl:
          type: string
          description: Small poster on the TMDb image CDN.
    MetadataEdit:
      type: object
      required: [title, genres, locked]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        originalTitle:
          type: string
          maxLength: 300
        year:
          type: integer
          minimum: 1870
          maximum: 2200
        overview:
          type: string
          maxLength: 10000
        tagline:
          type: string
          maxLength: 500
        genres:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
        officialRating:
          type: string
          maxLength: 20
        rating:
          type: number
          minimum: 0
          maximum: 10
        locked:
          type: boolean
          description: Keep these values when metadata is refreshed.
    Chapter:
      type: object
      required: [startMs, title]
      properties:
        startMs:
          type: integer
          format: int64
        title:
          type: string
    MediaSegment:
      type: object
      required: [kind, startMs, endMs]
      properties:
        kind:
          type: string
          enum: [intro, credits, recap, preview]
        startMs:
          type: integer
          format: int64
        endMs:
          type: integer
          format: int64
    TrickplayInfo:
      type: object
      required: [intervalMs, width, height, columns, rows, count, sheetUrls]
      properties:
        intervalMs:
          type: integer
        width:
          type: integer
        height:
          type: integer
        columns:
          type: integer
        rows:
          type: integer
        count:
          type: integer
        sheetUrls:
          type: array
          items:
            type: string
    MetadataSettings:
      type: object
      required: [tmdbConfigured, language, country]
      properties:
        tmdbConfigured:
          type: boolean
        language:
          type: string
          description: Preferred metadata language, e.g. "hr-HR" (English is the fallback).
        country:
          type: string
          description: Country for age ratings and release dates, e.g. "HR".
    MetadataSettingsInput:
      type: object
      required: [language, country]
      properties:
        tmdbApiKey:
          type: string
          maxLength: 512
          description: TMDb API key (v3) or API Read Access Token (v4). Omit to keep the current key.
        removeTmdbKey:
          type: boolean
        language:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
    Person:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          description: Character name for actors, job for crew (e.g. "Director").
        imageUrl:
          type: string
          description: Server-relative URL of the person's photo, when cached.
    ItemSummary:
      type: object
      required: [id, kind, title, addedAt, hasPoster]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeNumberEnd:
          type: integer
        durationMs:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        hasPoster:
          type: boolean
        hasBackdrop:
          type: boolean
          description: A wide backdrop image is available (images/backdrop).
        hasLogo:
          type: boolean
          description: A transparent title logo is available (images/logo, PNG).
        colors:
          type: array
          description: Characteristic colours of the artwork (#rrggbb, primary first) for ambient lighting.
          items:
            type: string
        seriesId:
          type: string
          format: uuid
          description: For episodes in Next Up / Continue watching.
        seriesTitle:
          type: string
        rating:
          type: number
          description: Community rating 0–10.
        parentId:
          type: string
          format: uuid
          description: The album of a track, the artist of an album, the season of an episode.
        artist:
          type: string
          description: Music, the performer (album artist for albums, track artist for tracks).
        album:
          type: string
          description: A track's album.
        videoHeight:
          type: integer
          description: Height of the best file's picture (for 4K/HD tags).
        hdr:
          type: string
          description: HDR format of the best file (HDR10, HLG, Dolby Vision), if any.
        positionMs:
          type: integer
          format: int64
          description: Resume position for the current profile.
        played:
          type: boolean
          description: Watched by the current profile.
        favorite:
          type: boolean
    ItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
    MediaFile:
      type: object
      required: [id, path, size, container]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Path inside the server's media folders.
        label:
          type: string
          description: Version label from the file name, e.g. "4K" or "Director's Cut".
        size:
          type: integer
          format: int64
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdr:
          type: string
          description: e.g. "HDR10", "HLG", "Dolby Vision" (empty for SDR).
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleStream"
    AudioStream:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
        language:
          type: string
        channels:
          type: integer
        title:
          type: string
    SubtitleStream:
      type: object
      required: [codec, external]
      properties:
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
    ItemDetail:
      type: object
      required: [item, libraryId, files, children, providerIds, genres, cast, crew, hasBackdrop]
      properties:
        locked:
          type: boolean
          description: Metadata was edited by hand and is kept on refresh.
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        hasLogo:
          type: boolean
        overview:
          type: string
        tagline:
          type: string
        originalTitle:
          type: string
        genres:
          type: array
          items:
            type: string
        studios:
          type: array
          description: Production companies or networks.
          items:
            type: string
        chapters:
