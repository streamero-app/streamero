    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ImportSource:
      type: object
      required: [url, apiKey]
      properties:
        url:
          type: string
          maxLength: 500
          description: Base URL of the server to import from, e.g. http://media:8096
        apiKey:
          type: string
          maxLength: 200
          description: An API key created by an administrator of that server.
    ImportSourceUser:
      type: object
      required: [id, name, isAdmin]
      properties:
        id:
          type: string
        name:
          type: string
        isAdmin:
          type: boolean
        suggestedUserId:
          type: string
          format: uuid
          description: Streamero user with the same username (case-insensitive).
    ImportSourceInfo:
      type: object
      required: [serverName, version, users]
      properties:
        serverName:
          type: string
        version:
          type: string
        users:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceUser"
    ImportUserMapping:
      type: object
      required: [sourceUserId, sourceUserName]
      properties:
        sourceUserId:
          type: string
          maxLength: 100
        sourceUserName:
          type: string
          maxLength: 200
        userId:
          type: string
          format: uuid
          description: Streamero user that receives the data; omitted = skip this user.
    ImportPathMapping:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          maxLength: 1000
          description: Path prefix as the other server sees the media (e.g. /data/movies).
        to:
          type: string
          maxLength: 1000
          description: The same folder as Streamero sees it; must be inside the media folders.
    ImportRequest:
      type: object
      required: [url, apiKey, dryRun, users]
      properties:
        url:
          type: string
          maxLength: 500
        apiKey:
          type: string
          maxLength: 200
        dryRun:
          type: boolean
          description: Match and count only; nothing is written.
        users:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ImportUserMapping"
        pathMappings:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ImportPathMapping"
        playlists:
          type: boolean
          default: true
    ImportProgress:
      type: object
      required: [usersDone, usersTotal]
      properties:
        usersDone:
          type: integer
        usersTotal:
          type: integer
        currentUser:
          type: string
    ImportUnmatched:
      type: object
      required: [user, name, kind]
      properties:
        user:
          type: string
        name:
          type: string
        kind:
          type: string
        path:
          type: string
    ImportUserReport:
      type: object
      required: [sourceUserName, userId, username, items, matched, unmatched, played, resume, favorites, playlists]
      properties:
        sourceUserName:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string
        items:
          type: integer
          description: Items with any user data on the other server.
        matched:
          type: integer
        unmatched:
          type: integer
        played:
          type: integer
        resume:
          type: integer
        favorites:
          type: integer
        playlists:
          type: integer
    ImportReport:
      type: object
      required: [users, skippedUsers, matchedByProvider, matchedByPath, matchedByTitle, unmatched, unmatchedSample,
        playlistsCreated, playlistsUpdated, playlistItemsMissing, keptNewer]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ImportUserReport"
        skippedUsers:
          type: array
          items:
            type: string
        matchedByProvider:
          type: integer
        matchedByPath:
          type: integer
        matchedByTitle:
          type: integer
        unmatched:
          type: integer
        unmatchedSample:
          type: array
          items:
            $ref: "#/components/schemas/ImportUnmatched"
        playlistsCreated:
          type: integer
        playlistsUpdated:
          type: integer
        playlistItemsMissing:
          type: integer
        keptNewer:
          type: integer
          description: Items whose Streamero progress was newer and therefore kept.
    ImportRun:
      type: object
      required: [id, status, dryRun, sourceUrl, createdAt, progress]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, done, failed]
        dryRun:
          type: boolean
        sourceUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        progress:
          $ref: "#/components/schemas/ImportProgress"
        report:
          $ref: "#/components/schemas/ImportReport"
    LiveTvCategory:
      type: string
      enum: [movies, sports, news, kids]
      description: Normalised category of a channel or programme (from M3U group-title or XMLTV category).
    LiveTvProgram:
      type: object
      required: [id, channelId, title, start, end, categories, isNew]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        channelNumber:
          type: string
        title:
          type: string
        subtitle:
          type: string
          description: Episode title.
        description:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: string
          description: Categories as the guide names them.
        category:
          $ref: "#/components/schemas/LiveTvCategory"
        season:
          type: integer
        episode:
          type: integer
        year:
          type: integer
        isNew:
          type: boolean
        isPremiere:
          type: boolean
        isRepeat:
          type: boolean
          description: The guide marks it as previously shown.
        isLive:
          type: boolean
        imageUrl:
          type: string
          description: Signed image URL (relative to the server).
        recordingId:
          type: string
          format: uuid
          description: Recording scheduled for this programme on this channel.
        recordingStatus:
          $ref: "#/components/schemas/LiveTvRecordingStatus"
        seriesRuleId:
          type: string
          format: uuid
    LiveTvChannel:
      type: object
      required: [id, number, name, tunerId, favorite]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        name:
          type: string
        group:
          type: string
          description: Group as the source names it (M3U group-title).
        category:
          $ref: "#/components/schemas/LiveTvCategory"
        logoUrl:
          type: string
          description: Signed logo URL (relative to the server).
        tunerId:
          type: string
          format: uuid
        favorite:
          type: boolean
        hd:
          type: boolean
        now:
          $ref: "#/components/schemas/LiveTvProgram"
        next:
          $ref: "#/components/schemas/LiveTvProgram"
    LiveTvGuideRow:
      type: object
      required: [channel, programs]
      properties:
        channel:
          $ref: "#/components/schemas/LiveTvChannel"
        programs:
          type: array
          items:
            $ref: "#/components/schemas/LiveTvProgram"
    LiveTvGuide:
      type: object
      required: [start, end, rows]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LiveTvGuideRow"
    LiveTvPlayRequest:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/DeviceProfile"
    LiveTvPlayback:
      type: object
      required: [channelId, url, method, timeshiftSeconds]
      properties:
        channelId:
          type: string
          format: uuid
        url:
          type: string
          description: Signed HLS playlist URL (relative to the server); a sliding live window.
        method:
          type: string
          enum: [remux, transcode]
        reason:
          type: string
        timeshiftSeconds:
          type: integer
          description: How far back the viewer can pause or rewind.
        now:
          $ref: "#/components/schemas/LiveTvProgram"
    LiveTvRecordingStatus:
      type: string
      enum: [scheduled, conflict, recording, completed, failed, cancelled, deleted]
    LiveTvRecording:
      type: object
      required: [id, title, start, end, prePaddingSeconds, postPaddingSeconds, priority, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        channelNumber:
          type: string
        programId:
          type: string
          format: uuid
        seriesRuleId:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        season:
          type: integer
        episode:
          type: integer
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        prePaddingSeconds:
          type: integer
        postPaddingSeconds:
          type: integer
        priority:
          type: integer
          description: Higher wins when tuners run out.
        status:
          $ref: "#/components/schemas/LiveTvRecordingStatus"
        error:
          type: string
          description: Why it failed, or which recordings it conflicts with.
        sizeBytes:
          type: integer
          format: int64
        itemId:
          type: string
          format: uuid
          description: Library item of the finished recording (once scanned).
        imageUrl:
          type: string
        postProcessError:
          type: string
        createdAt:
          type: string
          format: date-time
    LiveTvRecordingCreate:
      type: object
      required: [programId]
      properties:
        programId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
          description: Channel to record from (default the first channel showing the programme).
        prePaddingSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        postPaddingSeconds:
          type: integer
          minimum: 0
          maximum: 7200
        priority:
          type: integer
          minimum: -100
          maximum: 100
    LiveTvRecordingUpdate:
      type: object
      properties:
        prePaddingSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        postPaddingSeconds:
          type: integer
          minimum: 0
          maximum: 7200
        priority:
          type: integer
          minimum: -100
          maximum: 100
    LiveTvSeriesRule:
      type: object
      required: [id, title, newOnly, priority, keepLast, upcoming, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Programme title to match (case-insensitive).
        channelId:
          type: string
          format: uuid
          description: Only this channel; absent = any channel.
        channelName:
          type: string
        newOnly:
          type: boolean
          description: Skip airings the guide marks as repeats and episodes already recorded or scheduled.
        priority:
          type: integer
        prePaddingSeconds:
          type: integer
        postPaddingSeconds:
          type: integer
        keepLast:
          type: integer
          description: Retention keeps this many newest recordings (0 = the server default); only when retention is turned on.
        upcoming:
          type: integer
          description: Number of scheduled airings.
        createdAt:
          type: string
          format: date-time
    LiveTvSeriesRuleInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        programId:
          type: string
          format: uuid
          description: Take the title from this programme (when title is absent).
        channelId:
          type: string
          format: uuid
        newOnly:
          type: boolean
        priority:
          type: integer
          minimum: -100
          maximum: 100
        prePaddingSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        postPaddingSeconds:
          type: integer
          minimum: 0
          maximum: 7200
        keepLast:
          type: integer
          minimum: 0
          maximum: 1000
    LiveTvTunerKind:
      type: string
      enum: [m3u, hdhomerun]
    LiveTvTuner:
      type: object
      required: [id, kind, name, tunerCount, enabled, channelCount]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LiveTvTunerKind"
        name:
          type: string
        url:
          type: string
          description: Playlist URL (m3u) or device address (hdhomerun).
        filePath:
          type: string
          description: Playlist file on the server (m3u, instead of url).
        tunerCount:
          type: integer
          description: Simultaneous streams allowed (0 = unlimited, m3u only).
        userAgent:
          type: string
        enabled:
          type: boolean
        channelCount:
          type: integer
        deviceId:
          type: string
        model:
          type: string
        lastRefreshAt:
          type: string
          format: date-time
        error:
          type: string
    LiveTvTunerInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/LiveTvTunerKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2000
        filePath:
          type: string
          maxLength: 1000
        tunerCount:
          type: integer
          minimum: 0
          maximum: 64
          description: "m3u: streams the provider allows at once (0 = unlimited). hdhomerun: absent = the tuner count the device reports."
        userAgent:
          type: string
          maxLength: 300
        enabled:
          type: boolean
    LiveTvTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        channelCount:
          type: integer
        programCount:
          type: integer
        tunerCount:
          type: integer
        model:
          type: string
    LiveTvDiscoveredTuner:
      type: object
      required: [deviceId, name, url, tunerCount, added]
      properties:
        deviceId:
          type: string
        name:
          type: string
        model:
          type: string
        url:
          type: string
        tunerCount:
          type: integer
        added:
          type: boolean
          description: A tuner source with this device already exists.
    LiveTvGuideSource:
      type: object
      required: [id, name, refreshHours, enabled, channelCount, programCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        filePath:
          type: string
        timezone:
          type: string
          description: IANA zone for guide times without an offset (default UTC).
        refreshHours:
          type: integer
        enabled:
          type: boolean
        channelCount:
          type: integer
        programCount:
          type: integer
        lastRefreshAt:
          type: string
          format: date-time
        lastChangedAt:
          type: string
          format: date-time
          description: Last refresh that found changed programmes.
        lastResult:
          type: string
          description: Summary of the last refresh, e.g. "12 new, 3 changed, 840 unchanged".
        error:
          type: string
    LiveTvGuideSourceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2000
        filePath:
          type: string
          maxLength: 1000
        timezone:
          type: string
          maxLength: 64
        refreshHours:
          type: integer
          minimum: 1
          maximum: 168
        enabled:
          type: boolean
    LiveTvMappingMode:
      type: string
      enum: [auto, manual, none]
    LiveTvChannelAdmin:
      type: object
      required: [channel, mapping, hidden, tunerName]
      properties:
        channel:
          $ref: "#/components/schemas/LiveTvChannel"
        tunerName:
          type: string
        mapping:
          $ref: "#/components/schemas/LiveTvMappingMode"
        guideSourceId:
          type: string
          format: uuid
        guideChannelId:
          type: string
          description: XMLTV channel id the channel is mapped to (automatically or by hand).
        hidden:
          type: boolean
        categoryOverride:
          $ref: "#/components/schemas/LiveTvCategory"
        videoCodec:
          type: string
        audioCodec:
          type: string
    LiveTvGuideChannel:
      type: object
      required: [sourceId, id, name]
      properties:
        sourceId:
          type: string
          format: uuid
        id:
          type: string
        name:
          type: string
    LiveTvMapping:
      type: object
      required: [channels, guideChannels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/LiveTvChannelAdmin"
        guideChannels:
          type: array
          items:
            $ref: "#/components/schemas/LiveTvGuideChannel"
    LiveTvChannelUpdate:
      type: object
      properties:
        mapping:
          $ref: "#/components/schemas/LiveTvMappingMode"
        guideSourceId:
          type: string
          format: uuid
          description: With mapping manual.
        guideChannelId:
          type: string
          description: With mapping manual.
        hidden:
          type: boolean
        category:
          type: string
          enum: [auto, movies, sports, news, kids]
          description: Override the category ("auto" = from the source).
    LiveTvRetention:
      type: object
      required: [enabled, deleteAfterDays, keepLast]
      description: Opt-in clean-up of finished recordings. Only files the DVR recorded are ever deleted.
      properties:
        enabled:
          type: boolean
        deleteAfterDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: Delete recordings older than this (0 = never).
        keepLast:
          type: integer
          minimum: 0
          maximum: 1000
          description: Per series rule, keep this many newest recordings (0 = all); rules can override.
    LiveTvPostProcess:
      type: object
      required: [command, args, timeoutMinutes]
      description: |
        Program run after every finished recording, without a shell. command is an
        absolute path to an executable; each element of args is passed as one argument
        after replacing the placeholders {path} {dir} {filename} {title} {subtitle}
        {channel} {channelNumber} {start} {end} {season} {episode} {recordingId}.
        Only administrators may change it. Empty command = off.
      properties:
        command:
          type: string
          maxLength: 1000
        args:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 1000
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 1440
    LiveTvSettings:
      type: object
      required: [prePaddingSeconds, postPaddingSeconds, timeshiftMinutes, retention, postProcess]
      properties:
        prePaddingSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Default start padding of new recordings.
        postPaddingSeconds:
          type: integer
          minimum: 0
          maximum: 7200
        timeshiftMinutes:
          type: integer
          minimum: 1
          maximum: 240
          description: Length of the rolling buffer viewers can pause and rewind in.
        retention:
          $ref: "#/components/schemas/LiveTvRetention"
        postProcess:
          $ref: "#/components/schemas/LiveTvPostProcess"
        recordingsPath:
          type: string
          readOnly: true
          description: Folder recordings are written to (STREAMERO_RECORDINGS_DIR).
        recordingsLibraryId:
          type: string
          format: uuid
          readOnly: true
          description: Library the recordings appear in (created with the first recording).
