      summary: Sync offline progress and check that downloaded items may still be kept
      description: |
        Progress recorded offline is applied when it is newer than the server's (newest wins,
        by `updatedAt`; times in the future count as now). The answer has the server's state of
        every listed item and the items the profile may no longer keep (access, permission or
        parental limit lost, or the item is gone): clients delete those files.
      tags: [downloads]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineSyncRequest"
      responses:
        "200":
          description: Server state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineSyncResponse"
        default:
          $ref: "#/components/responses/Error"
