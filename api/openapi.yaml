  /backups/{backupName}/restore:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    post:
      operationId: restoreBackup
      summary: Replace the database (and config) with a backup, then restart
      description: |
        The archive is verified first; a backup from a newer database schema than this
        server is refused. A safety backup of the current state is written before anything
        is changed. The restore runs in the background and the server restarts when it is
        done; progress and the result are reported in `lastRestore` of GET /backups.
      tags: [admin]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupRequest"
      responses:
        "202":
          description: Restore started
        default:
          $ref: "#/components/responses/Error"
