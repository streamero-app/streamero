openapi: 3.1.0
info:
  title: Streamero API
  version: 0.1.0
  description: |
    Streamero media server API. This file is the single source of truth:
    server interfaces (ogen), the web client (openapi-typescript) and the iOS
    client (swift-openapi-generator) are generated from it.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: users
  - name: sessions
  - name: settings
  - name: apikeys
  - name: quickconnect
  - name: invites
  - name: profiles
  - name: libraries
  - name: items
  - name: playback
  - name: admin
security: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Used by clients to verify a server URL before login.
      tags: [system]
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "503":
          $ref: "#/components/responses/Starting"
        default:
          $ref: "#/components/responses/Error"
  /system/ping:
    get:
      operationId: ping
      summary: Liveness probe for clients
      tags: [system]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: create the first admin account"
      description: |
        Only allowed while `setupCompleted` is false. Requires the one-time setup code the
        server prints to its log on start (or STREAMERO_SETUP_CODE). Signs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: "Change own password; signs out all other sessions"
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTOTPSetup
      summary: Start enabling two-factor authentication
      description: Creates a new (not yet active) TOTP secret for the signed-in user.
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTOTP
      summary: Confirm a code from the authenticator app and turn 2FA on
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Enabled; one-time recovery codes (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTOTP
      summary: Turn 2FA off (requires the password)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Disabled
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/initiate:
    post:
      operationId: initiateQuickConnect
      summary: Start a Quick Connect sign-in on a new device
      description: |
        Returns a 6-digit code to show on the new device and a secret to poll with. A signed-in
        user approves the code (POST /quickconnect/authorize) within 5 minutes.
      tags: [quickconnect]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200":
          description: Code and polling secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStart"
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/poll:
    post:
      operationId: pollQuickConnect
      summary: Check whether the code was approved; signs the device in when it was
      tags: [quickconnect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickConnectPollRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "202":
          description: Not approved yet; poll again in a few seconds.
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/authorize:
    post:
      operationId: authorizeQuickConnect
      summary: Approve a Quick Connect code shown on another device
      description: The other device is signed in as the calling user.
      tags: [quickconnect]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectApproved"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (admin)
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update a user (admin)
      description: Disabling a user or changing the password signs out all of their sessions.
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user and all of their sessions (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      operationId: listSessions
      summary: Signed-in devices
      description: Own sessions; admins see the sessions of all users.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameSession
      summary: Rename a signed-in device
      description: Own sessions; admins can rename any session.
      tags: [sessions]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeSession
      summary: Sign a device out immediately
      description: Own sessions; admins can revoke any session.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /apikeys:
    get:
      operationId: listAPIKeys
      summary: API keys for integrations (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "200":
          description: API keys (the secret is never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin)
      description: |
        The key acts with the rights of the admin who created it and is deleted with that
        user. Send it as `Authorization: Bearer <key>`. The secret is returned only once.
      tags: [apikeys]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /apikeys/{apiKeyId}:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAPIKey
      summary: Revoke an API key immediately (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invites:
    get:
      operationId: listInvites
      summary: Invite links (admin)
      tags: [invites]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Invites (tokens are never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [invites]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created; the token is shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        default:
          $ref: "#/components/responses/Error"
  /invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [invites]
      security:
        - sessionToken: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invite/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getInvite
      summary: Check an invite link (public)
      tags: [invites]
      responses:
        "200":
          description: The invite is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: acceptInvite
      summary: Create an account from an invite and sign in (public)
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      operationId: listProfiles
      summary: Profiles of the signed-in user
      description: The account itself is the main profile; these are additional profiles (max 6).
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProfile
      summary: Add a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: updateProfile
      summary: Change a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      summary: Delete a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/select:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: selectProfile
      summary: Switch this device to a profile (PIN if the profile has one)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /profiles/main/select:
    post:
      operationId: selectMainProfile
      summary: Switch this device back to the main profile
      description: From a kids profile this needs the account password.
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      operationId: listLibraries
      summary: Libraries the caller may see
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibrary
      summary: Add a library and start scanning it (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    put:
      operationId: updateLibrary
      summary: Change a library (admin); changed folders are rescanned
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Remove a library from Streamero (admin). Media files are never touched.
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: scanLibrary
      summary: Scan a library for new, changed and removed files (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Scan queued
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort
        in: query
        schema:
          type: string
          enum: [title, year, added, rating]
          default: title
      - name: genre
        in: query
        schema:
          type: string
          maxLength: 100
      - name: unplayed
        in: query
        description: Only items the current profile has not watched.
        schema:
          type: boolean
    get:
      operationId: listLibraryItems
      summary: Top-level items of a library (movies, series), paged
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/genres:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryGenres
      summary: Genres used in a library (for filters)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Genres by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Search titles (typo tolerant) and people across visible libraries
      tags: [items]
      security:
        - sessionToken: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Matching items, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /home/latest:
    get:
      operationId: recentlyAdded
      summary: Recently added movies and series across visible libraries
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /home/favorites:
    get:
      operationId: listFavorites
      summary: Favorites of the current profile
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/user-data:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateUserData
      summary: Mark favorite and/or watched for the current profile
      description: Watching a series or season marks all its episodes.
      tags: [items]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDataUpdate"
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getItem
      summary: An item with its files and children (seasons/episodes)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/playback:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startPlayback
      summary: Decide how to play an item on this device and get signed stream URLs
      description: |
        Returns direct play when the device supports the file as is, otherwise an HLS stream
        (remux or transcode). Stream, HLS and subtitle URLs are HMAC-signed and short-lived;
        they are served outside this API (byte ranges, HLS segments) — see D-015.
      tags: [playback]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
      responses:
        "200":
          description: How to play
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/progress:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: reportProgress
      summary: Save the playback position (per profile)
      tags: [playback]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
  /home/next-up:
    get:
      operationId: nextUp
      summary: The next unwatched episode of each series the current profile is watching
      tags: [playback]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Episodes, most recently watched series first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/next:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: nextEpisode
      summary: The episode after this one (for autoplay)
      tags: [playback]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Next episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /me/preferences:
    get:
      operationId: getPreferences
      summary: Playback preferences of the current profile
      tags: [playback]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackPreferences"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePreferences
      summary: Save playback preferences of the current profile
      tags: [playback]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackPreferences"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackPreferences"
        default:
          $ref: "#/components/responses/Error"
  /home/continue:
    get:
      operationId: continueWatching
      summary: Started but unfinished items of the current profile, most recent first
      tags: [playback]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /fs/directories:
    get:
      operationId: browseDirectories
      summary: Sub-folders of a media folder, for choosing library folders (admin)
      description: Without `path`, returns the configured media roots.
      tags: [libraries]
      security:
        - sessionToken: []
      parameters:
        - name: path
          in: query
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        default:
          $ref: "#/components/responses/Error"
  /dashboard:
    get:
      operationId: getDashboard
      summary: Server overview for administrators (now playing, storage, activity)
      tags: [admin]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/Error"
  /tasks:
    get:
      operationId: listTasks
      summary: Scheduled maintenance tasks and their last run
      tags: [admin]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{taskKey}/run:
    parameters:
      - name: taskKey
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TaskKey"
    post:
      operationId: runTask
      summary: Run a task now
      tags: [admin]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /settings/notifications:
    get:
      operationId: getNotificationSettings
      summary: Webhook / push notification targets
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Targets (tokens are never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateNotificationSettings
      summary: Replace the notification targets (an empty token keeps the stored one)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        default:
          $ref: "#/components/responses/Error"
  /settings/notifications/test:
    post:
      operationId: testNotification
      summary: Send a test message to one target
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTarget"
      responses:
        "204":
          description: Delivered
        default:
          $ref: "#/components/responses/Error"
  /settings/metadata:
    get:
      operationId: getMetadataSettings
      summary: Metadata provider settings (admin); the TMDb key itself is never returned
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMetadataSettings
      summary: Save metadata settings (admin); a new TMDb key is verified with TMDb first
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/refresh-metadata:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: refreshLibraryMetadata
      summary: Fetch metadata again for every item of a library (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /people/{personId}/image:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: getPersonImage
      summary: Cached photo of a person (JPEG)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/images/{imageType}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageType
        in: path
        required: true
        schema:
          type: string
          enum: [poster, backdrop, still, logo]
    get:
      operationId: getItemImage
      summary: Cached artwork of an item (JPEG)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /settings/server:
    get:
      operationId: getServerSettings
      summary: Server-wide settings (admin)
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateServerSettings
      summary: Update server-wide settings (admin)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token from /auth/login or /setup, or an API key (`sk_…`) from /apikeys.
        Web clients get the session as the HttpOnly `streamero_session` cookie instead
        (useCookie: true), which the server accepts too.
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Starting:
      description: Server is starting; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        serverName:
          type: string
          maxLength: 100
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 32
          description: |
            Required when the user has 2FA on: a 6-digit code or a recovery code. Without it the
            server answers 401 `totp_required` (the password was correct, nothing else is revealed).
        useCookie:
          type: boolean
          description: Web clients set this to receive an HttpOnly cookie instead of a token.
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Safari on iPhone"
        client:
          type: string
          maxLength: 100
          description: e.g. "Streamero Web 0.1.0"
    AuthResult:
      type: object
      required: [user, sessionId]
      properties:
        token:
          type: string
          description: Bearer token. Omitted when useCookie was requested.
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Invite:
      type: object
      required: [id, note, createdBy, createdAt, expiresAt, maxUses, uses, permissions]
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        uses:
          type: integer
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreateInviteRequest:
      type: object
      required: [expiresInHours, maxUses]
      properties:
        note:
          type: string
          maxLength: 100
          description: e.g. "For my sister"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreatedInvite:
      type: object
      required: [token, invite]
      properties:
        token:
          type: string
          description: Goes into the link /invite/<token>. Shown only once.
        invite:
          $ref: "#/components/schemas/Invite"
    InviteInfo:
      type: object
      required: [serverName, expiresAt]
      properties:
        serverName:
          type: string
        expiresAt:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    QuickConnectStart:
      type: object
      required: [code, secret, expiresAt]
      properties:
        code:
          type: string
          description: 6 digits, shown on the new device.
        secret:
          type: string
          description: Kept on the new device and sent to /quickconnect/poll.
        expiresAt:
          type: string
          format: date-time
    QuickConnectPollRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 128
        useCookie:
          type: boolean
    QuickConnectApproved:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
    LibraryKind:
      type: string
      enum: [movies, shows, music, mixed]
    LibraryInput:
      type: object
      required: [name, kind, paths]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 4096
    Library:
      type: object
      required: [id, name, kind, paths, itemCount, scan]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          items:
            type: string
        itemCount:
          type: integer
        scan:
          $ref: "#/components/schemas/ScanStatus"
    ScanStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, queued, scanning, failed]
        lastScanAt:
          type: string
          format: date-time
        error:
          type: string
        filesSeen:
          type: integer
    ItemKind:
      type: string
      enum: [movie, series, season, episode]
    DeviceProfile:
      type: object
      description: What the client can decode natively.
      required: [containers, videoCodecs, audioCodecs]
      properties:
        containers:
          type: array
          items:
            type: string
          description: e.g. ["mp4", "webm"]
        videoCodecs:
          type: array
          items:
            type: string
          description: ffprobe codec names, e.g. ["h264", "hevc", "av1", "vp9"]
        audioCodecs:
          type: array
          items:
            type: string
          description: e.g. ["aac", "mp3", "opus", "flac", "ac3", "eac3"]
        hls:
          type: boolean
          description: The client plays HLS with fMP4 segments.
        maxHeight:
          type: integer
        maxBitrate:
          type: integer
          description: Bits per second; lower values force transcoding.
    PlaybackRequest:
      type: object
      required: [device]
      properties:
        fileId:
          type: string
          format: uuid
          description: Version to play (default the best one).
        audioIndex:
          type: integer
          description: Index into the file's audio tracks (default the first).
        startMs:
          type: integer
          format: int64
          description: Start position (default the saved resume position).
        device:
          $ref: "#/components/schemas/DeviceProfile"
    PlaybackInfo:
      type: object
      required: [fileId, method, url, startMs, subtitles, audio]
      properties:
        subtitleDefault:
          type: integer
          description: Position in subtitles to show by default (from the viewer's preferences); absent = off.
        fileId:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct, remux, transcode]
        url:
          type: string
          description: Signed URL (relative to the server) for the video element / player.
        startMs:
          type: integer
          format: int64
          description: Position the stream starts at; for HLS the stream itself starts there.
        durationMs:
          type: integer
          format: int64
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        audioIndex:
          type: integer
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSubtitle"
        reason:
          type: string
          description: Why the stream is not direct play (e.g. "audio codec dts").
    PlaybackSubtitle:
      type: object
      required: [index, url, external]
      properties:
        index:
          type: integer
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
        url:
          type: string
          description: Signed WebVTT URL.
    UserDataUpdate:
      type: object
      properties:
        favorite:
          type: boolean
        played:
          type: boolean
    ProgressReport:
      type: object
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
        played:
          type: boolean
          description: Mark as watched (set automatically past 90%).
    Dashboard:
      type: object
      required: [server, storage, nowPlaying, activeTranscodes, activity]
      properties:
        server:
          type: object
          required: [name, version, startedAt, os]
          properties:
            name:
              type: string
            version:
              type: string
            commit:
              type: string
            os:
              type: string
            startedAt:
              type: string
              format: date-time
        storage:
          type: array
          items:
            $ref: "#/components/schemas/StorageUsage"
        nowPlaying:
          type: array
          items:
            $ref: "#/components/schemas/NowPlaying"
        activeTranscodes:
          type: integer
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
    StorageUsage:
      type: object
      required: [kind, path, totalBytes, freeBytes]
      properties:
        kind:
          type: string
          enum: [media, cache, transcode]
        path:
          type: string
        totalBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
    NowPlaying:
      type: object
      required: [user, device, itemId, title, method, positionMs, updatedAt]
      properties:
        user:
          type: string
        profile:
          type: string
        device:
          type: string
        client:
          type: string
        itemId:
          type: string
          format: uuid
        title:
          type: string
        method:
          type: string
          enum: [direct, remux, transcode]
        reason:
          type: string
          description: Why the server remuxes or transcodes.
        positionMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ActivityEntry:
      type: object
      required: [at, action]
      properties:
        at:
          type: string
          format: date-time
        user:
          type: string
        action:
          type: string
          description: Machine-readable event (login.succeeded, user.created…).
        detail:
          type: object
          additionalProperties: true
    TaskKey:
      type: string
      enum: [scan_all, refresh_metadata, cleanup_images]
    Task:
      type: object
      required: [key, running]
      properties:
        key:
          $ref: "#/components/schemas/TaskKey"
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastState:
          type: string
          description: completed, failed or cancelled.
        interval:
          type: string
          description: Automatic schedule, e.g. "6h"; absent when manual only.
    NotificationEvent:
      type: string
      enum: [item.added, playback.started, login.succeeded, login.failed, scan.failed, test]
    NotificationTarget:
      type: object
      required: [id, name, kind, url, events, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [generic, discord, ntfy, gotify]
        url:
          type: string
          format: uri
          maxLength: 2000
        token:
          type: string
          maxLength: 500
          description: Write-only (ntfy access token, Gotify app token).
        hasToken:
          type: boolean
          readOnly: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEvent"
        enabled:
          type: boolean
    NotificationSettings:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/NotificationTarget"
    PlaybackPreferences:
      type: object
      required: [subtitleMode, autoplayNext]
      properties:
        audioLanguage:
          type: string
          maxLength: 3
          description: Preferred audio language (ISO 639-1 or -2, e.g. "hr", "eng"); empty = the file's default track.
        subtitleLanguage:
          type: string
          maxLength: 3
          description: Preferred subtitle language.
        subtitleMode:
          type: string
          enum: [default, smart, always, forced, none]
          description: >-
            default: forced subtitles in the audio language, else the preferred language when the audio differs;
            smart: the preferred language only when the audio is in another language; always: the preferred language;
            forced: forced subtitles only; none: off.
        autoplayNext:
          type: boolean
          description: Play the next episode automatically.
    MetadataSettings:
      type: object
      required: [tmdbConfigured, language, country]
      properties:
        tmdbConfigured:
          type: boolean
        language:
          type: string
          description: Preferred metadata language, e.g. "hr-HR" (English is the fallback).
        country:
          type: string
          description: Country for age ratings and release dates, e.g. "HR".
    MetadataSettingsInput:
      type: object
      required: [language, country]
      properties:
        tmdbApiKey:
          type: string
          maxLength: 512
          description: TMDb API key (v3) or API Read Access Token (v4). Omit to keep the current key.
        removeTmdbKey:
          type: boolean
        language:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
    Person:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          description: Character name for actors, job for crew (e.g. "Director").
        imageUrl:
          type: string
          description: Server-relative URL of the person's photo, when cached.
    ItemSummary:
      type: object
      required: [id, kind, title, addedAt, hasPoster]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeNumberEnd:
          type: integer
        durationMs:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        hasPoster:
          type: boolean
        hasBackdrop:
          type: boolean
          description: A wide backdrop image is available (images/backdrop).
        hasLogo:
          type: boolean
          description: A transparent title logo is available (images/logo, PNG).
        seriesId:
          type: string
          format: uuid
          description: For episodes in Next Up / Continue watching.
        seriesTitle:
          type: string
        rating:
          type: number
          description: Community rating 0–10.
        positionMs:
          type: integer
          format: int64
          description: Resume position for the current profile.
        played:
          type: boolean
          description: Watched by the current profile.
        favorite:
          type: boolean
    ItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
    MediaFile:
      type: object
      required: [id, path, size, container]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Path inside the server's media folders.
        label:
          type: string
          description: Version label from the file name, e.g. "4K" or "Director's Cut".
        size:
          type: integer
          format: int64
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdr:
          type: string
          description: e.g. "HDR10", "HLG", "Dolby Vision" (empty for SDR).
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleStream"
    AudioStream:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
        language:
          type: string
        channels:
          type: integer
        title:
          type: string
    SubtitleStream:
      type: object
      required: [codec, external]
      properties:
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
    ItemDetail:
      type: object
      required: [item, libraryId, files, children, providerIds, genres, cast, crew, hasBackdrop]
      properties:
        hasLogo:
          type: boolean
        overview:
          type: string
        tagline:
          type: string
        originalTitle:
          type: string
        genres:
          type: array
          items:
            type: string
        officialRating:
          type: string
          description: Age rating for the configured country, e.g. "12" or "PG-13".
        premiereDate:
          type: string
          format: date
        cast:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        crew:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        hasBackdrop:
          type: boolean
        metadataError:
          type: string
          description: Why metadata could not be fetched (e.g. no match), if so.
        item:
          $ref: "#/components/schemas/ItemSummary"
        libraryId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        providerIds:
          type: object
          additionalProperties:
            type: string
          description: "Provider IDs from file/folder names, e.g. tmdb=603, imdb=tt0133093."
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFile"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    DirectoryListing:
      type: object
      required: [directories]
      properties:
        path:
          type: string
          description: The listed folder (absent for the list of media roots).
        parent:
          type: string
        directories:
          type: array
          items:
            type: string
          description: Absolute paths of sub-folders.
    Profile:
      type: object
      required: [id, name, color, hasPin, isKid]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Avatar colour, e.g. "#e5484d".
        hasPin:
          type: boolean
        isKid:
          type: boolean
        maxRating:
          type: integer
          description: Highest age rating allowed (e.g. 12); applies from P3 (ratings) on.
    ProfileInput:
      type: object
      required: [name, color, isKid]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        isKid:
          type: boolean
        maxRating:
          type: integer
          minimum: 0
          maximum: 21
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          description: Set or change the PIN. Omit to keep it; see removePin.
        removePin:
          type: boolean
    PinRequest:
      type: object
      properties:
        pin:
          type: string
          maxLength: 6
    TOTPSetup:
      type: object
      required: [secret, otpauthUri, qrPng]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: otpauth:// link; opens the authenticator app on phones.
        qrPng:
          type: string
          description: The otpauth URI as a QR code (PNG, base64).
    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    PasswordConfirmRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    UserPermissions:
      type: object
      description: |
        What a non-admin may do (admins may do everything). Each permission is enforced by the
        feature it belongs to as that feature ships (libraries P2, playback P5, Live TV P11, ...).
      required: [allLibraries, download, videoTranscoding, audioTranscoding, remux, liveTv, manageLiveTv,
        syncPlay, deleteMedia, manageCollections, editSubtitles, remoteControl, maxSessions]
      properties:
        allLibraries:
          type: boolean
        download:
          type: boolean
        videoTranscoding:
          type: boolean
        audioTranscoding:
          type: boolean
        remux:
          type: boolean
        liveTv:
          type: boolean
        manageLiveTv:
          type: boolean
        syncPlay:
          type: boolean
        deleteMedia:
          type: boolean
        manageCollections:
          type: boolean
        editSubtitles:
          type: boolean
        remoteControl:
          type: boolean
        maxSessions:
          type: integer
          minimum: 0
          maximum: 100
          description: Signed-in devices allowed at once; 0 = unlimited. Signing in on one more device signs out the least recently used one.
    User:
      type: object
      required: [id, username, isAdmin, disabled, totpEnabled, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
          description: Two-factor authentication is on.
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        currentProfile:
          $ref: "#/components/schemas/Profile"
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        isAdmin:
          type: boolean
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    UpdateUserRequest:
      type: object
      properties:
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        password:
          $ref: "#/components/schemas/Password"
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        resetTwoFactor:
          type: boolean
          description: Turn the user's 2FA off (e.g. lost phone); signs them out everywhere.
    Session:
      type: object
      required: [id, userId, username, deviceName, client, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        deviceName:
          type: string
        client:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    RenameSessionRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First characters of the key, to recognise it.
        createdBy:
          type: string
          description: Username of the admin who created the key.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: e.g. "Jellyseerr"
    CreatedApiKey:
      type: object
      required: [key, apiKey]
      properties:
        key:
          type: string
          description: The secret. Shown only once.
        apiKey:
          $ref: "#/components/schemas/ApiKey"
    ServerSettings:
      type: object
      required: [serverName]
      properties:
        serverName:
          type: string
          minLength: 1
          maxLength: 100
    Pong:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SystemInfo:
      type: object
      required: [id, name, product, version, apiVersion, setupCompleted, startedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable server identifier, generated on first start.
        name:
          type: string
          description: Human readable server name.
        product:
          type: string
          description: Always "Streamero".
        version:
          type: string
        commit:
          type: string
        apiVersion:
          type: string
        setupCompleted:
          type: boolean
        startedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
