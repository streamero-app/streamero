      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getItem
      summary: An item with its files and children (seasons/episodes)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/playback:
