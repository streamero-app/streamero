openapi: 3.1.0
info:
  title: Streamero API
  version: 0.1.0
  description: |
    Streamero media server API. This file is the single source of truth:
    server interfaces (ogen), the web client (openapi-typescript) and the iOS
    client (swift-openapi-generator) are generated from it.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: users
  - name: sessions
  - name: settings
  - name: apikeys
  - name: quickconnect
  - name: invites
  - name: profiles
  - name: libraries
  - name: items
  - name: playback
  - name: admin
  - name: collections
  - name: playlists
  - name: import
  - name: downloads
    description: Offline downloads for the apps and original-file downloads (D-040).
  - name: livetv
    description: |
      Live TV and DVR (D-041). Watching needs the `liveTv` permission; tuners, guides,
      channel mapping, recordings and series rules need `manageLiveTv`.
  - name: syncplay
    description: |
      Watch together (SyncPlay). Groups are managed here; playback inside a group
      runs over the WebSocket `GET /api/v1/syncplay/socket` (same credentials as
      the API: the session cookie from the same origin, or `Authorization: Bearer`).
      Every socket message is a JSON object with a `type`: clients send
      `SyncClientMessage`, the server sends `SyncServerMessage` (D-036).
security: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Used by clients to verify a server URL before login.
      tags: [system]
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "503":
          $ref: "#/components/responses/Starting"
        default:
          $ref: "#/components/responses/Error"
  /system/ping:
    get:
      operationId: ping
      summary: Liveness probe for clients
      tags: [system]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: create the first admin account"
      description: |
        Only allowed while `setupCompleted` is false. Requires the one-time setup code the
        server prints to its log on start (or STREAMERO_SETUP_CODE). Signs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMe
      summary: Change own display name, e-mail and language
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/me/avatar:
    put:
      operationId: setMyAvatar
      summary: Upload own picture (JPEG, PNG or GIF, up to 8 MB; cropped to a square)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyAvatar
      summary: Remove own picture
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfileAvatar
      summary: Upload a profile's picture
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfileAvatar
      summary: Remove a profile's picture
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /avatars/{ownerId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        description: A user or profile id.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAvatar
      summary: A user's or profile's picture (JPEG)
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /auth/providers:
    get:
      operationId: getAuthProviders
      summary: Sign-in methods offered on the login screen (public)
      description: |
        Unauthenticated. Lists the enabled single sign-on providers with the absolute URL a
        browser (or an app's web authentication session) opens to start signing in, and
        whether username/password sign-in is offered.
      tags: [auth]
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/{providerId}/authorize:
    get:
      operationId: oidcAuthorize
      summary: Start OpenID Connect sign-in (browser navigation; redirects to the provider)
      description: |
        Opened in a browser, never fetched. Creates a single-use sign-in flow (state, nonce,
        PKCE S256) bound to this browser by a short-lived cookie and redirects to the
        provider. Apps pass `client=app`, their registered `redirectUri` and an S256
        `codeChallenge`; after the callback they receive a one-time code to redeem at
        /auth/oidc/exchange with the matching verifier. Errors redirect to the login page.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/OidcProviderId"
        - name: client
          in: query
          schema:
            type: string
            enum: [web, app]
            default: web
        - name: redirectUri
          in: query
          description: App only; must be exactly `streamero://oidc`.
          schema:
            type: string
            maxLength: 200
        - name: codeChallenge
          in: query
          description: App only; BASE64URL(SHA-256(verifier)), 43 characters.
          schema:
            type: string
            maxLength: 128
      responses:
        "302":
          $ref: "#/components/responses/OidcRedirect"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/{providerId}/callback:
    get:
      operationId: oidcCallback
      summary: Redirect target registered at the provider
      description: |
        Checks state (single use, bound to the browser cookie), exchanges the code with the
        PKCE verifier, verifies the ID token (signature via the provider's JWKS, issuer,
        audience, expiry, nonce) and signs the user in. The web gets the session cookie and
        is sent to `/`; apps are sent to their redirect URI with a one-time `code` (never a
        session token). Failures redirect with an `sso_error` (web) or `error` (app) code.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/OidcProviderId"
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 256
        - name: error
          in: query
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: streamero_oidc
          in: cookie
          schema:
            type: string
            maxLength: 256
      responses:
        "302":
          $ref: "#/components/responses/OidcRedirect"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/exchange:
    post:
      operationId: oidcExchange
      summary: Redeem an app's one-time sign-in code for a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/{providerId}/link:
    post:
      operationId: oidcLink
      summary: Start linking an OpenID Connect account to the signed-in user
      description: |
        Returns the provider URL to open in this browser; sets the flow cookie. After the
        provider signs the user in, the identity is linked and the browser returns to
        /settings/account.
      tags: [auth]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/OidcProviderId"
      responses:
        "200":
          description: Provider URL
          headers:
            Set-Cookie:
              description: Short-lived cookie that binds the flow to this browser.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcLinkStart"
        default:
          $ref: "#/components/responses/Error"
  /auth/identities:
    get:
      operationId: listIdentities
      summary: Single sign-on and directory accounts linked to the signed-in user
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Linked identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedIdentities"
        default:
          $ref: "#/components/responses/Error"
  /auth/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink an identity (refused when it is the account's only way to sign in)
      tags: [auth]
      security:
        - sessionToken: []
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Unlinked
        default:
          $ref: "#/components/responses/Error"
  /settings/auth:
    get:
      operationId: getAuthSettings
      summary: General sign-in settings (admin)
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAuthSettings
      summary: Save general sign-in settings (admin)
      description: |
        Turning password sign-in off is refused (409 `no_sso_admin`) unless an enabled
        administrator has a linked identity of an enabled provider.
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        default:
          $ref: "#/components/responses/Error"
  /settings/auth/oidc:
    get:
      operationId: listOidcProviders
      summary: OpenID Connect providers (admin; client secrets are never returned)
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProvider"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOidcProvider
      summary: Add an OpenID Connect provider (admin)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        default:
          $ref: "#/components/responses/Error"
  /settings/auth/oidc/{providerId}:
    put:
      operationId: updateOidcProvider
      summary: Change an OpenID Connect provider (admin; an empty secret keeps the stored one)
      tags: [settings]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/OidcProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOidcProvider
      summary: Remove an OpenID Connect provider and its linked identities (admin)
      tags: [settings]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/OidcProviderId"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /settings/auth/oidc-test:
    post:
      operationId: testOidcProvider
      summary: Fetch a provider's discovery document and signing keys (admin)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcTestRequest"
      responses:
        "200":
          description: The provider answered correctly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcTestResult"
        default:
          $ref: "#/components/responses/Error"
  /settings/auth/ldap:
    get:
      operationId: getLdapSettings
      summary: LDAP / Active Directory sign-in (admin; the bind password is never returned)
      tags: [settings]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateLdapSettings
      summary: Save LDAP settings (admin; an empty bind password keeps the stored one)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapSettings"
        default:
          $ref: "#/components/responses/Error"
  /settings/auth/ldap/test:
    post:
      operationId: testLdapSettings
      summary: Connect and bind with the given settings, optionally looking up a user (admin)
      tags: [settings]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapTestRequest"
      responses:
        "200":
          description: Result (`ok` false with a message when the directory refused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapTestResult"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: "Change own password; signs out all other sessions"
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTOTPSetup
      summary: Start enabling two-factor authentication
      description: Creates a new (not yet active) TOTP secret for the signed-in user.
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTOTP
      summary: Confirm a code from the authenticator app and turn 2FA on
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Enabled; one-time recovery codes (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTOTP
      summary: Turn 2FA off (requires the password)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Disabled
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/initiate:
    post:
      operationId: initiateQuickConnect
      summary: Start a Quick Connect sign-in on a new device
      description: |
        Returns a 6-digit code to show on the new device and a secret to poll with. A signed-in
        user approves the code (POST /quickconnect/authorize) within 5 minutes.
      tags: [quickconnect]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200":
          description: Code and polling secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStart"
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/poll:
    post:
      operationId: pollQuickConnect
      summary: Check whether the code was approved; signs the device in when it was
      tags: [quickconnect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickConnectPollRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "202":
          description: Not approved yet; poll again in a few seconds.
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/authorize:
    post:
      operationId: authorizeQuickConnect
      summary: Approve a Quick Connect code shown on another device
      description: The other device is signed in as the calling user.
      tags: [quickconnect]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectApproved"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (admin)
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update a user (admin)
      description: Disabling a user or changing the password signs out all of their sessions.
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user and all of their sessions (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      operationId: listSessions
      summary: Signed-in devices
      description: Own sessions; admins see the sessions of all users.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameSession
      summary: Rename a signed-in device
      description: Own sessions; admins can rename any session.
      tags: [sessions]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeSession
      summary: Sign a device out immediately
      description: Own sessions; admins can revoke any session.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /apikeys:
    get:
      operationId: listAPIKeys
      summary: API keys for integrations (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "200":
          description: API keys (the secret is never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin)
      description: |
        The key acts with the rights of the admin who created it and is deleted with that
        user. Send it as `Authorization: Bearer <key>`. The secret is returned only once.
      tags: [apikeys]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
