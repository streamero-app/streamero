  /downloads:
    get:
      operationId: listDownloads
      summary: Offline download jobs of the current profile
      description: |
        Server-side download jobs (D-040). A job is a request to get one file in one quality:
        the original file, or a mobile-friendly MP4 (H.264/AAC) the server transcodes into its
        download cache in the background. Clients delete a job once the file is on the device;
        the device's offline library is the client's own.
      tags: [downloads]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Download"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDownloads
      summary: Download a movie, an episode, a season, a series or its next N episodes
      description: |
        Needs the `download` permission; transcoded qualities also need `videoTranscoding`.
        Parental limits of the current profile apply. Asking again for the same file and
        quality returns the existing job (idempotent).
      tags: [downloads]
      security:
        - sessionToken: []
      requestBody:
