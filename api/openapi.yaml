      summary: Progress and report of one import (admin)
      tags: [import]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token from /auth/login or /setup, or an API key (`sk_…`) from /apikeys.
        Web clients get the session as the HttpOnly `streamero_session` cookie instead
        (useCookie: true), which the server accepts too.
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupName:
      name: backupName
      in: path
      required: true
      description: File name of a backup in the backup folder.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,180}\\.tar\\.gz$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SignedIn:
      description: Signed in
      headers:
        Set-Cookie:
          description: HttpOnly session cookie, only when useCookie was requested.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
    Starting:
      description: Server is starting; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      minLength: 1
      maxLength: 64
      description: Case-insensitive; letters, digits, space and . _ - @
    Password:
      type: string
      minLength: 8
      maxLength: 256
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 64
        serverName:
          type: string
          maxLength: 100
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
        totpCode:
          type: string
          maxLength: 32
          description: |
            Required when the user has 2FA on: a 6-digit code or a recovery code. Without it the
            server answers 401 `totp_required` (the password was correct, nothing else is revealed).
        useCookie:
          type: boolean
          description: Web clients set this to receive an HttpOnly cookie instead of a token.
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: e.g. "Safari on iPhone"
        client:
          type: string
          maxLength: 100
          description: e.g. "Streamero Web 0.1.0"
    AuthResult:
      type: object
      required: [user, sessionId]
      properties:
        token:
          type: string
          description: Bearer token. Omitted when useCookie was requested.
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
        newPassword:
          $ref: "#/components/schemas/Password"
    Invite:
      type: object
      required: [id, note, createdBy, createdAt, expiresAt, maxUses, uses, permissions]
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        uses:
          type: integer
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreateInviteRequest:
      type: object
      required: [expiresInHours, maxUses]
      properties:
        note:
          type: string
          maxLength: 100
          description: e.g. "For my sister"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    CreatedInvite:
      type: object
      required: [token, invite]
      properties:
        token:
          type: string
          description: Goes into the link /invite/<token>. Shown only once.
        invite:
          $ref: "#/components/schemas/Invite"
    InviteInfo:
      type: object
      required: [serverName, expiresAt]
      properties:
        serverName:
          type: string
        expiresAt:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        useCookie:
          type: boolean
        device:
          $ref: "#/components/schemas/DeviceInfo"
    QuickConnectStart:
      type: object
      required: [code, secret, expiresAt]
      properties:
        code:
          type: string
          description: 6 digits, shown on the new device.
        secret:
          type: string
          description: Kept on the new device and sent to /quickconnect/poll.
        expiresAt:
          type: string
          format: date-time
    QuickConnectPollRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 128
        useCookie:
          type: boolean
    QuickConnectApproved:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
    LibraryKind:
      type: string
      enum: [movies, shows, music, mixed]
    LibraryInput:
      type: object
      required: [name, kind, paths]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 4096
    Library:
      type: object
      required: [id, name, kind, paths, itemCount, scan]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        paths:
          type: array
          items:
            type: string
        itemCount:
          type: integer
        scan:
          $ref: "#/components/schemas/ScanStatus"
    ScanStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, queued, scanning, failed]
        lastScanAt:
          type: string
          format: date-time
        error:
          type: string
        filesSeen:
          type: integer
    ItemKind:
      type: string
      enum: [movie, series, season, episode, artist, album, track]
    DeviceProfile:
      type: object
      description: What the client can decode natively.
      required: [containers, videoCodecs, audioCodecs]
      properties:
        containers:
          type: array
          items:
            type: string
          description: e.g. ["mp4", "webm"]
        videoCodecs:
          type: array
          items:
            type: string
          description: ffprobe codec names, e.g. ["h264", "hevc", "av1", "vp9"]
        audioCodecs:
          type: array
          items:
            type: string
          description: e.g. ["aac", "mp3", "opus", "flac", "ac3", "eac3"]
        hls:
          type: boolean
          description: The client plays HLS with fMP4 segments.
        maxHeight:
          type: integer
        maxBitrate:
          type: integer
          description: Bits per second; lower values force transcoding.
        subtitleCodecs:
          type: array
          items:
            type: string
          description: >-
            Bitmap subtitle formats the client draws itself when it plays the file directly
            (ffprobe names, e.g. ["hdmv_pgs_subtitle", "dvd_subtitle"]). Other bitmap tracks
            are burned into the picture when chosen. Text tracks are always offered as WebVTT.
    PlaybackRequest:
      type: object
      required: [device]
      properties:
        fileId:
          type: string
          format: uuid
          description: Version to play (default the best one).
        audioIndex:
          type: integer
          description: Index into the file's audio tracks (default the first).
        startMs:
          type: integer
          format: int64
          description: Start position (default the saved resume position).
        subtitleIndex:
          type: integer
          description: >-
            Subtitle track chosen by the viewer (index into the file's subtitle tracks; -1 = none).
            A bitmap track (PGS, VobSub, DVB) the client cannot draw is burned into the picture,
            which makes the stream a transcode. Absent = automatic: a forced bitmap track picked
            by the viewer's subtitle preference is burned in.
        burnSubtitle:
          type: boolean
          description: Burn the chosen subtitleIndex in even when it is a text track (keeps ASS/SSA styling).
        device:
          $ref: "#/components/schemas/DeviceProfile"
    PlaybackInfo:
      type: object
      required: [fileId, method, url, startMs, subtitles, audio]
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MediaSegment"
        trickplay:
          $ref: "#/components/schemas/TrickplayInfo"
        subtitleDefault:
          type: integer
          description: Position in subtitles to show by default (from the viewer's preferences); absent = off.
        fileId:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct, remux, transcode]
        url:
          type: string
          description: Signed URL (relative to the server) for the video element / player.
        startMs:
          type: integer
          format: int64
          description: Position the stream starts at; for HLS the stream itself starts there.
        durationMs:
          type: integer
          format: int64
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        audioIndex:
          type: integer
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSubtitle"
        reason:
          type: string
          description: Why the stream is not direct play (e.g. "audio codec dts", "subtitle burn-in").
        bitmapSubtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackBitmapSubtitle"
          description: Bitmap subtitle tracks; choosing one restarts playback with subtitleIndex (burned in).
        burnedSubtitle:
          type: integer
          description: Index of the subtitle track burned into this stream (absent = none).
    PlaybackBitmapSubtitle:
      type: object
      required: [index, codec]
      properties:
        index:
          type: integer
          description: Index into the file's subtitle tracks (the value for subtitleIndex).
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
    PlaybackSubtitle:
      type: object
      required: [index, url, external]
      properties:
        index:
          type: integer
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
        url:
          type: string
          description: Signed WebVTT URL.
    UserDataUpdate:
      type: object
      properties:
        favorite:
          type: boolean
        played:
          type: boolean
    ProgressReport:
      type: object
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
        played:
          type: boolean
          description: Mark as watched (set automatically past 90%).
    Dashboard:
      type: object
      required: [server, storage, nowPlaying, activeTranscodes, activity]
      properties:
        server:
          type: object
          required: [name, version, startedAt, os]
          properties:
            name:
              type: string
            version:
              type: string
            commit:
              type: string
            os:
              type: string
            startedAt:
              type: string
              format: date-time
        storage:
          type: array
          items:
            $ref: "#/components/schemas/StorageUsage"
        nowPlaying:
          type: array
          items:
            $ref: "#/components/schemas/NowPlaying"
        activeTranscodes:
          type: integer
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
    StorageUsage:
      type: object
      required: [kind, path, totalBytes, freeBytes]
      properties:
        kind:
          type: string
          enum: [media, cache, transcode]
        path:
          type: string
        totalBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
    NowPlaying:
      type: object
      required: [key, user, device, itemId, title, method, positionMs, updatedAt]
      properties:
        key:
          type: string
          description: Identifies the playing session for remote commands.
        user:
          type: string
        profile:
          type: string
        device:
          type: string
        client:
          type: string
        itemId:
          type: string
          format: uuid
        title:
          type: string
        method:
          type: string
          enum: [direct, remux, transcode]
        reason:
          type: string
          description: Why the server remuxes or transcodes.
        positionMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ActivityEntry:
      type: object
      required: [at, action]
      properties:
        at:
          type: string
          format: date-time
        user:
          type: string
        action:
          type: string
          description: Machine-readable event (login.succeeded, user.created…).
        detail:
          type: object
          additionalProperties: true
    TaskKey:
      type: string
      enum: [scan_all, refresh_metadata, cleanup_images, analyze_media, detect_segments, backup]
    Task:
      type: object
      required: [key, running]
      properties:
        key:
          $ref: "#/components/schemas/TaskKey"
        running:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        lastState:
          type: string
          description: completed, failed or cancelled.
        interval:
          type: string
          description: Automatic schedule, e.g. "6h"; absent when manual only.
    BackupKind:
      type: string
      enum: [scheduled, manual, pre_restore, uploaded]
    Backup:
      type: object
      required: [name, sizeBytes, createdAt, kind, serverVersion, schemaVersion, includesImages, scanRunning, restorable]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/BackupKind"
        serverVersion:
          type: string
        schemaVersion:
          type: integer
          format: int64
        includesImages:
          type: boolean
        scanRunning:
          type: boolean
          description: A library scan was running while the backup was taken.
        restorable:
          type: boolean
          description: False when the archive is unreadable or from a newer database schema than this server.
        problem:
          type: string
          description: Why the backup cannot be restored (unreadable, newer_schema).
        skippedTables:
          type: array
          description: Tables that could not be read when the backup was taken (damaged rows).
          items:
            type: string
    BackupSettings:
      type: object
      required: [enabled, keepLast, includeImages]
      properties:
        enabled:
          type: boolean
          description: Write a backup automatically once a day.
        keepLast:
          type: integer
          minimum: 1
          maximum: 100
          description: Scheduled and manual backups kept; older ones are deleted.
        includeImages:
          type: boolean
          description: Also archive downloaded artwork (it can be fetched again, so it is off by default).
    RestoreStatus:
      type: object
      required: [backup, state, startedAt]
      properties:
        backup:
          type: string
        state:
          type: string
          enum: [running, succeeded, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        safetyBackup:
          type: string
          description: Backup of the state just before the restore.
        warnings:
          type: array
          items:
            type: string
    BackupOverview:
      type: object
      required: [dir, backups, settings, scanRunning, running, schemaVersion]
      properties:
        dir:
          type: string
          description: Backup folder inside the server container.
        backups:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        settings:
          $ref: "#/components/schemas/BackupSettings"
        scanRunning:
          type: boolean
          description: A library scan is running now.
        running:
          type: boolean
          description: A backup is queued or being written.
        schemaVersion:
          type: integer
          format: int64
          description: Newest database schema this server knows.
        lastRestore:
          $ref: "#/components/schemas/RestoreStatus"
    BackupQueued:
      type: object
      required: [scanRunning]
      properties:
        scanRunning:
          type: boolean
          description: A library scan is running; the backup is still consistent but may miss items being added.
    RestoreBackupRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must repeat the backup name exactly.
    NotificationEvent:
      type: string
      enum: [item.added, playback.started, login.succeeded, login.failed, scan.failed, test]
    NotificationTarget:
      type: object
      required: [id, name, kind, url, events, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [generic, discord, ntfy, gotify]
        url:
          type: string
          format: uri
          maxLength: 2000
        token:
          type: string
          maxLength: 500
          description: Write-only (ntfy access token, Gotify app token).
        hasToken:
          type: boolean
          readOnly: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEvent"
        enabled:
          type: boolean
    NotificationSettings:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/NotificationTarget"
    PlaybackPreferences:
      type: object
      required: [subtitleMode, autoplayNext]
      properties:
        audioLanguage:
          type: string
          maxLength: 3
          description: Preferred audio language (ISO 639-1 or -2, e.g. "hr", "eng"); empty = the file's default track.
        subtitleLanguage:
          type: string
          maxLength: 3
          description: Preferred subtitle language.
        subtitleMode:
          type: string
          enum: [default, smart, always, forced, none]
          description: >-
            default: forced subtitles in the audio language, else the preferred language when the audio differs;
            smart: the preferred language only when the audio is in another language; always: the preferred language;
            forced: forced subtitles only; none: off.
        autoplayNext:
          type: boolean
          description: Play the next episode automatically.
        skipBackSeconds:
          type: integer
          minimum: 5
          maximum: 60
        skipForwardSeconds:
          type: integer
          minimum: 5
          maximum: 120
        maxBitrateKbps:
          type: integer
          minimum: 0
          maximum: 200000
          description: Streaming limit for this profile; 0 = no limit.
        maxHeight:
          type: integer
          minimum: 0
          maximum: 4320
          description: Highest picture height to stream (e.g. 1080); 0 = original.
        upNextSeconds:
          type: integer
          minimum: 0
          maximum: 60
          description: Countdown before the next episode; 0 = show the card without counting down.
        skipIntro:
          type: string
          enum: [button, auto, off]
        skipCredits:
          type: string
          enum: [button, auto, off]
        subtitleSize:
          type: string
          enum: [small, normal, large, xlarge]
        subtitleColor:
          type: string
          enum: [white, yellow, cyan]
        subtitleBackground:
          type: string
          enum: [none, shadow, box]
        subtitlePosition:
          type: integer
          minimum: 0
          maximum: 40
          description: Lift from the bottom edge, in percent of the picture height.
        homeSections:
          type: array
          description: Order and visibility of the sections on the home page.
          maxItems: 12
          items:
            type: string
            enum: [continue, nextUp, latest, favorites, collections, top, genres, libraries]
    Collection:
      type: object
      required: [id, name, itemCount, hasPoster, hasBackdrop, auto]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        overview:
          type: string
        itemCount:
          type: integer
        hasPoster:
          type: boolean
        hasBackdrop:
          type: boolean
        auto:
          type: boolean
          description: Created from TMDb (box set); kept in sync by metadata refresh.
    CollectionDetail:
      type: object
      required: [collection, items]
      properties:
        collection:
          $ref: "#/components/schemas/Collection"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    CollectionInput:
      type: object
      required: [name, itemIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        overview:
          type: string
          maxLength: 2000
        itemIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    Playlist:
      type: object
      required: [id, name, itemCount, public, mine, durationMs]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        itemCount:
          type: integer
        durationMs:
          type: integer
          format: int64
        public:
          type: boolean
        mine:
          type: boolean
          description: The current profile owns it (may edit).
        coverItemIds:
          type: array
          description: Up to four items whose artwork makes the cover.
          items:
            type: string
            format: uuid
    PlaylistDetail:
      type: object
      required: [playlist, items]
      properties:
        playlist:
          $ref: "#/components/schemas/Playlist"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    PlaylistInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        public:
          type: boolean
        itemIds:
          type: array
          maxItems: 500
          description: Full order on update; omitted keeps the items.
          items:
            type: string
            format: uuid
    IdentifyResult:
      type: object
      required: [tmdbId, title]
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        originalTitle:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterUrl:
          type: string
          description: Small poster on the TMDb image CDN.
    MetadataEdit:
      type: object
      required: [title, genres, locked]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        originalTitle:
          type: string
          maxLength: 300
        year:
          type: integer
          minimum: 1870
          maximum: 2200
        overview:
          type: string
          maxLength: 10000
        tagline:
          type: string
          maxLength: 500
        genres:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
        officialRating:
          type: string
          maxLength: 20
        rating:
          type: number
          minimum: 0
          maximum: 10
        locked:
          type: boolean
          description: Keep these values when metadata is refreshed.
    Chapter:
      type: object
      required: [startMs, title]
      properties:
        startMs:
          type: integer
          format: int64
        title:
          type: string
    MediaSegment:
      type: object
      required: [kind, startMs, endMs]
      properties:
        kind:
          type: string
          enum: [intro, credits, recap, preview]
        startMs:
          type: integer
          format: int64
        endMs:
          type: integer
          format: int64
    TrickplayInfo:
      type: object
      required: [intervalMs, width, height, columns, rows, count, sheetUrls]
      properties:
        intervalMs:
          type: integer
        width:
          type: integer
        height:
          type: integer
        columns:
          type: integer
        rows:
          type: integer
        count:
          type: integer
        sheetUrls:
          type: array
          items:
            type: string
    MetadataSettings:
      type: object
      required: [tmdbConfigured, language, country]
      properties:
        tmdbConfigured:
          type: boolean
        language:
          type: string
          description: Preferred metadata language, e.g. "hr-HR" (English is the fallback).
        country:
          type: string
          description: Country for age ratings and release dates, e.g. "HR".
    MetadataSettingsInput:
      type: object
      required: [language, country]
      properties:
        tmdbApiKey:
          type: string
          maxLength: 512
          description: TMDb API key (v3) or API Read Access Token (v4). Omit to keep the current key.
        removeTmdbKey:
          type: boolean
        language:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
    Person:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          description: Character name for actors, job for crew (e.g. "Director").
        imageUrl:
          type: string
          description: Server-relative URL of the person's photo, when cached.
    ItemSummary:
      type: object
      required: [id, kind, title, addedAt, hasPoster]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeNumberEnd:
          type: integer
        durationMs:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        hasPoster:
          type: boolean
        hasBackdrop:
          type: boolean
          description: A wide backdrop image is available (images/backdrop).
        hasLogo:
          type: boolean
          description: A transparent title logo is available (images/logo, PNG).
        colors:
          type: array
          description: Characteristic colours of the artwork (#rrggbb, primary first) for ambient lighting.
          items:
            type: string
        seriesId:
          type: string
          format: uuid
          description: For episodes in Next Up / Continue watching.
        seriesTitle:
          type: string
        rating:
          type: number
          description: Community rating 0–10.
        parentId:
          type: string
          format: uuid
          description: The album of a track, the artist of an album, the season of an episode.
        artist:
          type: string
          description: Music, the performer (album artist for albums, track artist for tracks).
        album:
          type: string
          description: A track's album.
        videoHeight:
          type: integer
          description: Height of the best file's picture (for 4K/HD tags).
        hdr:
          type: string
          description: HDR format of the best file (HDR10, HLG, Dolby Vision), if any.
        positionMs:
          type: integer
          format: int64
          description: Resume position for the current profile.
        played:
          type: boolean
          description: Watched by the current profile.
        favorite:
          type: boolean
    ItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
    MediaFile:
      type: object
      required: [id, path, size, container]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Path inside the server's media folders.
        label:
          type: string
          description: Version label from the file name, e.g. "4K" or "Director's Cut".
        size:
          type: integer
          format: int64
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdr:
          type: string
          description: e.g. "HDR10", "HLG", "Dolby Vision" (empty for SDR).
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioStream"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleStream"
    AudioStream:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
        language:
          type: string
        channels:
          type: integer
        title:
          type: string
    SubtitleStream:
      type: object
      required: [codec, external]
      properties:
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        external:
          type: boolean
    ItemDetail:
      type: object
      required: [item, libraryId, files, children, providerIds, genres, cast, crew, hasBackdrop]
      properties:
        locked:
          type: boolean
          description: Metadata was edited by hand and is kept on refresh.
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        hasLogo:
          type: boolean
        overview:
          type: string
        tagline:
          type: string
        originalTitle:
          type: string
        genres:
          type: array
          items:
            type: string
        studios:
          type: array
          description: Production companies or networks.
          items:
            type: string
        chapters:
          type: array
          description: Chapters of the first file (for the chapter list on the item page).
          items:
            $ref: "#/components/schemas/Chapter"
        trickplay:
          $ref: "#/components/schemas/TrickplayInfo"
        officialRating:
          type: string
          description: Age rating for the configured country, e.g. "12" or "PG-13".
        premiereDate:
          type: string
          format: date
        cast:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        crew:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        hasBackdrop:
          type: boolean
        metadataError:
          type: string
          description: Why metadata could not be fetched (e.g. no match), if so.
        item:
          $ref: "#/components/schemas/ItemSummary"
        libraryId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        providerIds:
          type: object
          additionalProperties:
            type: string
          description: "Provider IDs from file/folder names, e.g. tmdb=603, imdb=tt0133093."
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFile"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
    DirectoryListing:
      type: object
      required: [directories]
      properties:
        path:
          type: string
          description: The listed folder (absent for the list of media roots).
        parent:
          type: string
        directories:
          type: array
          items:
            type: string
          description: Absolute paths of sub-folders.
    Profile:
      type: object
      required: [id, name, color, hasPin, isKid]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Avatar colour, e.g. "#e5484d".
        hasPin:
          type: boolean
        isKid:
          type: boolean
        maxRating:
          type: integer
          description: Highest age rating allowed (e.g. 12); applies from P3 (ratings) on.
        hasAvatar:
          type: boolean
    ProfileInput:
      type: object
      required: [name, color, isKid]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        isKid:
          type: boolean
        maxRating:
          type: integer
          minimum: 0
          maximum: 21
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          description: Set or change the PIN. Omit to keep it; see removePin.
        removePin:
          type: boolean
    PinRequest:
      type: object
      properties:
        pin:
          type: string
          maxLength: 6
    TOTPSetup:
      type: object
      required: [secret, otpauthUri, qrPng]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: otpauth:// link; opens the authenticator app on phones.
        qrPng:
          type: string
          description: The otpauth URI as a QR code (PNG, base64).
    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    PasswordConfirmRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    UserPermissions:
      type: object
      description: |
        What a non-admin may do (admins may do everything). Each permission is enforced by the
        feature it belongs to as that feature ships (libraries P2, playback P5, Live TV P11, ...).
      required: [allLibraries, download, videoTranscoding, audioTranscoding, remux, liveTv, manageLiveTv,
        syncPlay, deleteMedia, manageCollections, editSubtitles, remoteControl, maxSessions]
      properties:
        allLibraries:
          type: boolean
        download:
          type: boolean
        videoTranscoding:
          type: boolean
        audioTranscoding:
          type: boolean
        remux:
          type: boolean
        liveTv:
          type: boolean
        manageLiveTv:
          type: boolean
        syncPlay:
          type: boolean
        deleteMedia:
          type: boolean
        manageCollections:
          type: boolean
        editSubtitles:
          type: boolean
        remoteControl:
          type: boolean
        maxSessions:
          type: integer
          minimum: 0
          maximum: 100
          description: Signed-in devices allowed at once; 0 = unlimited. Signing in on one more device signs out the least recently used one.
    User:
      type: object
      required: [id, username, isAdmin, disabled, totpEnabled, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        totpEnabled:
          type: boolean
          description: Two-factor authentication is on.
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        currentProfile:
          $ref: "#/components/schemas/Profile"
        displayName:
          type: string
        email:
          type: string
        language:
          type: string
          enum: [en, hr]
          description: Interface language chosen by the user.
        hasAvatar:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    SessionCommand:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, stop]
        text:
          type: string
          maxLength: 500
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 60
        email:
          type: string
          maxLength: 200
          description: Used for notifications; empty removes it.
        language:
          type: string
          enum: [en, hr]
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        isAdmin:
          type: boolean
        permissions:
          $ref: "#/components/schemas/UserPermissions"
    UpdateUserRequest:
      type: object
      properties:
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        password:
          $ref: "#/components/schemas/Password"
        permissions:
          $ref: "#/components/schemas/UserPermissions"
        resetTwoFactor:
          type: boolean
          description: Turn the user's 2FA off (e.g. lost phone); signs them out everywhere.
    Session:
      type: object
      required: [id, userId, username, deviceName, client, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        deviceName:
          type: string
        client:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    RenameSessionRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First characters of the key, to recognise it.
        createdBy:
          type: string
          description: Username of the admin who created the key.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: e.g. "Jellyseerr"
    CreatedApiKey:
      type: object
      required: [key, apiKey]
      properties:
        key:
          type: string
          description: The secret. Shown only once.
        apiKey:
          $ref: "#/components/schemas/ApiKey"
    ServerSettings:
      type: object
      required: [serverName]
      properties:
        serverName:
          type: string
          minLength: 1
          maxLength: 100
    Pong:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    EncodingSettings:
      type: object
      required: [hardwareAcceleration, preset, quality, audioBitrateKbps, segmentSeconds, maxSessions, toneMapping]
      properties:
        hardwareAcceleration:
          type: string
          enum: [none, vaapi, qsv, nvenc]
        vaapiDevice:
          type: string
          maxLength: 100
          description: Render node for VAAPI, e.g. /dev/dri/renderD128.
        preset:
          type: string
          enum: [ultrafast, superfast, veryfast, faster, fast, medium, slow]
        quality:
          type: integer
          minimum: 14
          maximum: 35
          description: Constant quality (CRF / CQ / QP); lower is better and larger.
        audioBitrateKbps:
          type: integer
          minimum: 64
          maximum: 640
        segmentSeconds:
          type: integer
          minimum: 2
          maximum: 10
        maxSessions:
          type: integer
          minimum: 0
          maximum: 64
          description: Transcodes at once; 0 = no limit.
        toneMapping:
          type: boolean
          description: Convert HDR to SDR when transcoding for screens without HDR.
    ResumeSettings:
      type: object
      required: [minResumePercent, maxResumePercent, minResumeDurationSeconds]
      properties:
        minResumePercent:
          type: integer
          minimum: 0
          maximum: 50
          description: Below this much of the length, stopping does not save a position.
        maxResumePercent:
          type: integer
          minimum: 50
          maximum: 100
          description: From this much of the length, the title counts as watched.
        minResumeDurationSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Shorter titles never keep a position.
    BrandingSettings:
      type: object
      required: [loginDisclaimer, customCss]
      properties:
        loginDisclaimer:
          type: string
          maxLength: 2000
          description: Shown under the sign-in form.
        customCss:
          type: string
          maxLength: 20000
          description: Extra CSS added to every page of the web client.
    DlnaSettings:
      type: object
      required: [enabled, friendlyName, language]
      properties:
        enabled:
          type: boolean
          description: Announce the server to TVs on the local network and let them browse and play (off by default).
        friendlyName:
          type: string
          maxLength: 64
          description: Name TVs show for this server; empty = the server name.
        userId:
          type: string
          format: uuid
          description: Streamero user whose libraries, limits and progress DLNA uses. Required when enabled.
        profileId:
          type: string
          format: uuid
          description: Profile of that user to act as; omitted = the main profile.
        language:
          type: string
          enum: [en, hr]
          description: Language of the folder names TVs show ("Recently added", "Genres" ...).
    DlnaStatus:
      type: object
      required: [available, running, httpAddr, ssdp]
      properties:
        available:
          type: boolean
          description: False when DLNA is turned off for the whole process (STREAMERO_DLNA=false).
        running:
          type: boolean
          description: Enabled, a user is chosen and the HTTP listener is up.
        httpAddr:
          type: string
          description: Listen address of the DLNA HTTP side, e.g. ":8788".
        ssdp:
          type: boolean
          description: The SSDP (UDP 1900) listener is up.
        interfaces:
          type: array
          items:
            type: string
          description: Network interfaces the server announces itself on.
        error:
          type: string
          description: Why a listener could not start (port taken ...).
    DlnaUserChoice:
      type: object
      required: [id, username, profiles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        profiles:
          type: array
          items:
            type: object
            required: [id, name, isKid]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              isKid:
                type: boolean
    DlnaOverview:
      type: object
      required: [settings, status, users]
      properties:
        settings:
          $ref: "#/components/schemas/DlnaSettings"
        status:
          $ref: "#/components/schemas/DlnaStatus"
        users:
          type: array
          items:
            $ref: "#/components/schemas/DlnaUserChoice"
    LogEntry:
      type: object
      required: [time, level, message, source]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        source:
          type: string
          description: serve or worker.
        attrs:
          type: string
          description: The record's fields as key=value pairs.
    ActivityPage:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        total:
          type: integer
    RequestSettings:
      type: object
      required: [seerrConfigured, usersCanRequest, radarrConfigured, sonarrConfigured]
      properties:
        seerrUrl:
          type: string
        seerrConfigured:
          type: boolean
        usersCanRequest:
          type: boolean
          description: Everyone (not only administrators) can request titles.
        radarrUrl:
          type: string
        radarrConfigured:
          type: boolean
        sonarrUrl:
          type: string
        sonarrConfigured:
          type: boolean
        bazarrUrl:
          type: string
        bazarrConfigured:
          type: boolean
    RequestSettingsInput:
      type: object
      required: [usersCanRequest]
      properties:
        seerrUrl:
          type: string
          maxLength: 300
        seerrApiKey:
          type: string
          maxLength: 200
        usersCanRequest:
          type: boolean
        radarrUrl:
          type: string
          maxLength: 300
        radarrApiKey:
          type: string
          maxLength: 200
        sonarrUrl:
          type: string
          maxLength: 300
        sonarrApiKey:
          type: string
          maxLength: 200
        bazarrUrl:
          type: string
          maxLength: 300
        bazarrApiKey:
          type: string
          maxLength: 200
        removeKeys:
          type: array
          items:
            type: string
            enum: [seerr, radarr, sonarr, bazarr]
    ConnectionCheck:
      type: object
      required: [app, ok]
      properties:
        app:
          type: string
        ok:
          type: boolean
        version:
          type: string
        error:
          type: string
    DiscoverTitle:
      type: object
      required: [tmdbId, mediaType, title, status]
      properties:
        tmdbId:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterUrl:
          type: string
        backdropUrl:
          type: string
        rating:
          type: number
        status:
          type: string
          enum: [none, pending, processing, partial, available]
        itemId:
          type: string
          format: uuid
          description: The title in this server's libraries, when it is already here.
    DiscoverPage:
      type: object
      required: [configured, canRequest, titles, page, totalPages]
      properties:
        configured:
          type: boolean
          description: Seerr is connected.
        canRequest:
          type: boolean
        titles:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverTitle"
        page:
          type: integer
        totalPages:
          type: integer
    TitleRequest:
      type: object
      required: [tmdbId, mediaType]
      properties:
        tmdbId:
          type: integer
          minimum: 1
        mediaType:
          type: string
          enum: [movie, tv]
    TitleRequestResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, processing, partial, available]
    UpcomingRelease:
      type: object
      required: [kind, title, date, downloaded]
      properties:
        kind:
          type: string
          enum: [movie, episode]
        title:
          type: string
        seriesTitle:
          type: string
        season:
          type: integer
        episode:
          type: integer
        date:
          type: string
          format: date-time
        overview:
          type: string
        posterUrl:
          type: string
        downloaded:
          type: boolean
    Enhancements:
      type: object
      description: Features other servers need plugins for, built in and switchable.
      required: [qualityTags, randomButton, pauseScreen, arrLinks, discoverInSearch, removeFromContinue, shortcutsHelp, autoPip]
      properties:
        qualityTags:
          type: boolean
          description: 4K / HDR / Dolby Vision tags on posters.
        randomButton:
          type: boolean
          description: A "surprise me" button on home and in libraries.
        pauseScreen:
          type: boolean
          description: Title, year and story on screen while paused.
        arrLinks:
          type: boolean
          description: Open a title in Radarr or Sonarr (administrators).
        discoverInSearch:
          type: boolean
          description: Search also offers titles to request through Seerr.
        removeFromContinue:
          type: boolean
          description: Remove a title from Continue watching.
        shortcutsHelp:
          type: boolean
          description: Show keyboard shortcuts with "?".
        autoPip:
          type: boolean
          description: Keep playing in picture-in-picture when switching tabs.
    ArrLink:
      type: object
      required: [app, url]
      properties:
        app:
          type: string
          enum: [radarr, sonarr]
        url:
          type: string
    SubtitleOffer:
      type: object
      required: [provider, language, forced, hearingImpaired, score, subtitle, originalFormat]
      properties:
        provider:
          type: string
          maxLength: 100
        language:
          type: string
          maxLength: 20
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        score:
          type: number
        release:
          type: array
          items:
            type: string
        uploader:
          type: string
        subtitle:
          type: string
          maxLength: 20000
          description: Bazarr's handle for this offer, passed back unchanged to download it.
        originalFormat:
          type: boolean
    SubtitleSearch:
      type: object
      required: [configured, offers]
      properties:
        configured:
          type: boolean
          description: Bazarr (and Radarr/Sonarr for the lookup) are connected.
        offers:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleOffer"
    SystemInfo:
      type: object
      required: [id, name, product, version, apiVersion, setupCompleted, startedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable server identifier, generated on first start.
        name:
          type: string
          description: Human readable server name.
        product:
          type: string
          description: Always "Streamero".
        version:
          type: string
        commit:
          type: string
        apiVersion:
          type: string
        setupCompleted:
          type: boolean
        startedAt:
          type: string
          format: date-time
        loginDisclaimer:
          type: string
        customCss:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ImportSource:
      type: object
      required: [url, apiKey]
      properties:
        url:
          type: string
          maxLength: 500
          description: Base URL of the server to import from, e.g. http://media:8096
        apiKey:
          type: string
          maxLength: 200
          description: An API key created by an administrator of that server.
    ImportSourceUser:
      type: object
      required: [id, name, isAdmin]
      properties:
        id:
          type: string
        name:
          type: string
        isAdmin:
          type: boolean
        suggestedUserId:
          type: string
          format: uuid
          description: Streamero user with the same username (case-insensitive).
    ImportSourceInfo:
      type: object
      required: [serverName, version, users]
      properties:
        serverName:
          type: string
        version:
          type: string
        users:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceUser"
    ImportUserMapping:
      type: object
      required: [sourceUserId, sourceUserName]
      properties:
        sourceUserId:
          type: string
          maxLength: 100
        sourceUserName:
          type: string
          maxLength: 200
        userId:
          type: string
          format: uuid
          description: Streamero user that receives the data; omitted = skip this user.
    ImportPathMapping:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          maxLength: 1000
          description: Path prefix as the other server sees the media (e.g. /data/movies).
        to:
          type: string
          maxLength: 1000
          description: The same folder as Streamero sees it; must be inside the media folders.
    ImportRequest:
      type: object
      required: [url, apiKey, dryRun, users]
      properties:
        url:
          type: string
          maxLength: 500
        apiKey:
          type: string
          maxLength: 200
        dryRun:
          type: boolean
          description: Match and count only; nothing is written.
        users:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ImportUserMapping"
        pathMappings:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ImportPathMapping"
        playlists:
          type: boolean
          default: true
    ImportProgress:
      type: object
      required: [usersDone, usersTotal]
      properties:
        usersDone:
          type: integer
        usersTotal:
          type: integer
        currentUser:
          type: string
    ImportUnmatched:
      type: object
      required: [user, name, kind]
      properties:
        user:
          type: string
        name:
          type: string
        kind:
          type: string
        path:
          type: string
    ImportUserReport:
      type: object
      required: [sourceUserName, userId, username, items, matched, unmatched, played, resume, favorites, playlists]
      properties:
        sourceUserName:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string
        items:
          type: integer
          description: Items with any user data on the other server.
        matched:
          type: integer
        unmatched:
          type: integer
        played:
          type: integer
        resume:
          type: integer
        favorites:
          type: integer
        playlists:
          type: integer
    ImportReport:
      type: object
      required: [users, skippedUsers, matchedByProvider, matchedByPath, matchedByTitle, unmatched, unmatchedSample,
        playlistsCreated, playlistsUpdated, playlistItemsMissing, keptNewer]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ImportUserReport"
        skippedUsers:
          type: array
          items:
            type: string
        matchedByProvider:
          type: integer
        matchedByPath:
          type: integer
        matchedByTitle:
          type: integer
        unmatched:
          type: integer
        unmatchedSample:
          type: array
          items:
            $ref: "#/components/schemas/ImportUnmatched"
        playlistsCreated:
          type: integer
        playlistsUpdated:
          type: integer
        playlistItemsMissing:
          type: integer
        keptNewer:
          type: integer
          description: Items whose Streamero progress was newer and therefore kept.
    ImportRun:
      type: object
      required: [id, status, dryRun, sourceUrl, createdAt, progress]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, done, failed]
        dryRun:
          type: boolean
        sourceUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        progress:
          $ref: "#/components/schemas/ImportProgress"
        report:
          $ref: "#/components/schemas/ImportReport"
