  /livetv/channels/{channelId}/play:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: playLiveTvChannel
      summary: Tune a channel and get a signed HLS URL (liveTv permission)
      description: |
        The channel is always delivered as HLS: remuxed (stream copy) when the device
        plays the channel's codecs, otherwise transcoded with the server's encoding
        settings, using the same decision and permissions as on-demand playback. The
        playlist is a sliding window of `timeshiftSeconds`, so players can pause and
        rewind within it (time-shift). Viewers of the same channel with the same
        delivery share one tuner. 503 `tuners_busy` when every tuner of the channel's
        source is in use.
      tags: [livetv]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveTvPlayRequest"
      responses:
        "200":
          description: How to play
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTvPlayback"
        default:
          $ref: "#/components/responses/Error"
