openapi: 3.1.0
info:
  title: Streamero API
  version: 0.1.0
  description: |
    Streamero media server API. This file is the single source of truth:
    server interfaces (ogen), the web client (openapi-typescript) and the iOS
    client (swift-openapi-generator) are generated from it.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: setup
  - name: auth
  - name: users
  - name: sessions
  - name: settings
  - name: apikeys
  - name: quickconnect
  - name: invites
  - name: profiles
  - name: libraries
  - name: items
  - name: playback
  - name: admin
  - name: collections
  - name: playlists
  - name: import
security: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Public server information
      description: Unauthenticated. Used by clients to verify a server URL before login.
      tags: [system]
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "503":
          $ref: "#/components/responses/Starting"
        default:
          $ref: "#/components/responses/Error"
  /system/ping:
    get:
      operationId: ping
      summary: Liveness probe for clients
      tags: [system]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: create the first admin account"
      description: |
        Only allowed while `setupCompleted` is false. Requires the one-time setup code the
        server prints to its log on start (or STREAMERO_SETUP_CODE). Signs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the web session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMe
      summary: Change own display name, e-mail and language
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/me/avatar:
    put:
      operationId: setMyAvatar
      summary: Upload own picture (JPEG, PNG or GIF, up to 8 MB; cropped to a square)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyAvatar
      summary: Remove own picture
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfileAvatar
      summary: Upload a profile's picture
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfileAvatar
      summary: Remove a profile's picture
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /avatars/{ownerId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        description: A user or profile id.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAvatar
      summary: A user's or profile's picture (JPEG)
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: "Change own password; signs out all other sessions"
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/setup:
    post:
      operationId: startTOTPSetup
      summary: Start enabling two-factor authentication
      description: Creates a new (not yet active) TOTP secret for the signed-in user.
      tags: [auth]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/enable:
    post:
      operationId: enableTOTP
      summary: Confirm a code from the authenticator app and turn 2FA on
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Enabled; one-time recovery codes (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTOTP
      summary: Turn 2FA off (requires the password)
      tags: [auth]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Disabled
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/initiate:
    post:
      operationId: initiateQuickConnect
      summary: Start a Quick Connect sign-in on a new device
      description: |
        Returns a 6-digit code to show on the new device and a secret to poll with. A signed-in
        user approves the code (POST /quickconnect/authorize) within 5 minutes.
      tags: [quickconnect]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200":
          description: Code and polling secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStart"
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/poll:
    post:
      operationId: pollQuickConnect
      summary: Check whether the code was approved; signs the device in when it was
      tags: [quickconnect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickConnectPollRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "202":
          description: Not approved yet; poll again in a few seconds.
        default:
          $ref: "#/components/responses/Error"
  /quickconnect/authorize:
    post:
      operationId: authorizeQuickConnect
      summary: Approve a Quick Connect code shown on another device
      description: The other device is signed in as the calling user.
      tags: [quickconnect]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectApproved"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (admin)
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update a user (admin)
      description: Disabling a user or changing the password signs out all of their sessions.
      tags: [users]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user and all of their sessions (admin)
      tags: [users]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      operationId: listSessions
      summary: Signed-in devices
      description: Own sessions; admins see the sessions of all users.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameSession
      summary: Rename a signed-in device
      description: Own sessions; admins can rename any session.
      tags: [sessions]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeSession
      summary: Sign a device out immediately
      description: Own sessions; admins can revoke any session.
      tags: [sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /apikeys:
    get:
      operationId: listAPIKeys
      summary: API keys for integrations (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "200":
          description: API keys (the secret is never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin)
      description: |
        The key acts with the rights of the admin who created it and is deleted with that
        user. Send it as `Authorization: Bearer <key>`. The secret is returned only once.
      tags: [apikeys]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        default:
          $ref: "#/components/responses/Error"
  /apikeys/{apiKeyId}:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAPIKey
      summary: Revoke an API key immediately (admin)
      tags: [apikeys]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invites:
    get:
      operationId: listInvites
      summary: Invite links (admin)
      tags: [invites]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Invites (tokens are never returned again)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [invites]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created; the token is shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        default:
          $ref: "#/components/responses/Error"
  /invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [invites]
      security:
        - sessionToken: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /invite/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getInvite
      summary: Check an invite link (public)
      tags: [invites]
      responses:
        "200":
          description: The invite is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: acceptInvite
      summary: Create an account from an invite and sign in (public)
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      operationId: listProfiles
      summary: Profiles of the signed-in user
      description: The account itself is the main profile; these are additional profiles (max 6).
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProfile
      summary: Add a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: updateProfile
      summary: Change a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      summary: Delete a profile (not from a kids profile)
      tags: [profiles]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/select:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: selectProfile
      summary: Switch this device to a profile (PIN if the profile has one)
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /profiles/main/select:
    post:
      operationId: selectMainProfile
      summary: Switch this device back to the main profile
      description: From a kids profile this needs the account password.
      tags: [profiles]
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Switched
        default:
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      operationId: listLibraries
      summary: Libraries the caller may see
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibrary
      summary: Add a library and start scanning it (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    put:
      operationId: updateLibrary
      summary: Change a library (admin); changed folders are rescanned
      tags: [libraries]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Remove a library from Streamero (admin). Media files are never touched.
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: scanLibrary
      summary: Scan a library for new, changed and removed files (admin)
      tags: [libraries]
      security:
        - sessionToken: []
      responses:
        "202":
          description: Scan queued
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort
        in: query
        schema:
          type: string
          enum: [title, year, added, rating, random]
          default: title
      - name: genre
        in: query
        schema:
          type: string
          maxLength: 100
      - name: unplayed
        in: query
        description: Only items the current profile has not watched.
        schema:
          type: boolean
      - name: favorite
        in: query
        description: Only items on the current profile's list.
        schema:
          type: boolean
      - name: resumable
        in: query
        description: Only items started but not finished.
        schema:
          type: boolean
      - name: yearFrom
        in: query
        schema:
          type: integer
          minimum: 1800
          maximum: 3000
      - name: yearTo
        in: query
        schema:
          type: integer
          minimum: 1800
          maximum: 3000
      - name: letter
        in: query
        description: First letter of the sort title ("#" for digits and symbols).
        schema:
          type: string
          maxLength: 1
      - name: kind
        in: query
        description: In music libraries, list artists, albums or tracks instead of top-level items.
        schema:
          type: string
          enum: [artist, album, track]
    get:
      operationId: listLibraryItems
      summary: Top-level items of a library (movies, series), paged
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/genres:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryGenres
      summary: Genres used in a library (for filters)
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Genres by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Search titles (typo tolerant) and people across visible libraries
      tags: [items]
      security:
        - sessionToken: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Matching items, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemSummary"
        default:
          $ref: "#/components/responses/Error"
  /home/latest:
    get:
      operationId: recentlyAdded
      summary: Recently added movies and series across visible libraries
      tags: [items]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Items
          content:
