# fail2ban filter: clients probing a Streamero site for files it never has.
# nginx answers those with 444 (deploy/nginx/streamero-hardening.conf) and logs
# them in the "streamero" format: ip - host [time] "METHOD uri HTTP/x" status …
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ \S* \S+" 444 
ignoreregex =
