# fail2ban jails for a Streamero host. Installed by scripts/harden-host.sh as
# /etc/fail2ban/jail.d/streamero.conf (SSH_PORT is filled in by the script).

[DEFAULT]
# Repeat offenders are banned longer each time (1 h, 2 h, 4 h … up to a week).
bantime.increment = true
bantime.maxtime   = 1w

# Password guessing on SSH: five failures in ten minutes.
[sshd]
enabled  = true
port     = SSH_PORT
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 1h

# Scanners probing the Streamero site: five probes in ten minutes.
[streamero-probes]
enabled  = true
port     = http,https
filter   = streamero-probes
logpath  = /var/log/nginx/streamero.access.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h
