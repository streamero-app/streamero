# Streamero: per-site hardening. Install as /etc/nginx/snippets/streamero-hardening.conf
# and include it inside the site's server block (scripts/harden-host.sh does).
# Needs /etc/nginx/conf.d/streamero-http.conf.

access_log /var/log/nginx/streamero.access.log streamero;
server_tokens off;

limit_req  zone=streamero_ip burst=300 nodelay;
limit_conn streamero_conn 100;
limit_req_status  429;
limit_conn_status 429;

# What scanners look for is never part of Streamero: close the connection without
# an answer (444). fail2ban's streamero-probes jail bans clients that keep trying.
location ~ /\.(?!well-known/) { return 444; }
location ~* ^/(?!stream/|api/|dlna/).*\.(php\d?|phtml|aspx?|jsp|cgi|pl|env|sql|bak|old|ini|sh|pem|key)$ { return 444; }
location ~* ^/(wp-admin|wp-content|wp-includes|phpmyadmin|pma|cgi-bin|boaform|HNAP1|actuator|vendor/phpunit|solr|owa|autodiscover)(/|$) { return 444; }
