# nginx site for the demo instance. Install to /etc/nginx/sites-available/demo.streamero.net
# and symlink into sites-enabled (see docs/DEPLOY.md).
# Starts as HTTP only; `certbot --nginx -d demo.streamero.net` adds the 443 block and the redirect.
# Upstream is the dev compose stack bound to 127.0.0.1:${HTTP_PORT} (deploy/.env).
map $http_upgrade $streamero_demo_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.streamero.net;

    client_max_body_size 0;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;

        # Streaming: pass bytes through immediately, keep range requests intact,
        # and allow long-lived connections (direct play, HLS, WebSockets).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $streamero_demo_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
