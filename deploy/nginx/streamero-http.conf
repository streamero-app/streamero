# Streamero: http-level definitions. Install as /etc/nginx/conf.d/streamero-http.conf
# (scripts/harden-host.sh does). Defines nothing that affects other sites until a
# server block uses these zones or this log format.

# Access log without query strings: stream and client URLs carry signatures and
# tokens (?sig=…, ?api_key=…) that must not end up in a log file. The host is
# logged so several sites can be told apart.
log_format streamero '$remote_addr - $host [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

# Per-client limits, generous enough for a page of posters or an HLS player:
# 50 requests a second on average with bursts (set in the server block), and a
# cap on parallel connections. A scanner or a runaway client gets 429.
limit_req_zone  $binary_remote_addr zone=streamero_ip:10m   rate=50r/s;
limit_conn_zone $binary_remote_addr zone=streamero_conn:10m;
