# Dev override: build the image locally instead of pulling from GHCR. Real media stays
# at /media (MEDIA_PATH); generated test media (scripts/gen-fixtures.sh) is at /fixtures.
services:
  streamero:
    image: streamero:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${STREAMERO_BUILD_VERSION:-dev}
        COMMIT: ${STREAMERO_BUILD_COMMIT:-unknown}
        FFMPEG_SOURCE: ${FFMPEG_SOURCE:-extended}
    environment:
      STREAMERO_LOG_LEVEL: debug
      STREAMERO_MEDIA_ROOTS: /media,/fixtures
    volumes:
      - ../data/fixtures:/fixtures:ro
  worker:
    image: streamero:dev
    environment:
      STREAMERO_LOG_LEVEL: debug
      STREAMERO_MEDIA_ROOTS: /media,/fixtures
    volumes:
      - ../data/fixtures:/fixtures:ro
