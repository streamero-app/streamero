name: streamero

x-common: &common
  image: ghcr.io/${GH_OWNER:-streamero-app}/streamero:${STREAMERO_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ:-Europe/Zagreb}
    STREAMERO_DB_URL: postgres://streamero:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/streamero?sslmode=disable
    STREAMERO_VALKEY_URL: redis://valkey:6379/0
    # Optional fixed first-run setup code; otherwise a random one is printed to the log.
    STREAMERO_SETUP_CODE: ${STREAMERO_SETUP_CODE:-}
    # Reverse proxies whose X-Forwarded-For is trusted (see docs/DEPLOY.md).
    STREAMERO_TRUSTED_PROXIES: ${STREAMERO_TRUSTED_PROXIES:-}
    STREAMERO_AUTH_RATE_LIMIT: ${STREAMERO_AUTH_RATE_LIMIT:-20,10}
    # Lets administrators sign in with a password while password sign-in is turned off
    # for single sign-on; only for recovery (docs/SSO.md, D-037).
    STREAMERO_PASSWORD_LOGIN_RECOVERY: ${STREAMERO_PASSWORD_LOGIN_RECOVERY:-false}
    # Folders libraries may use (inside the container); MEDIA_PATH is mounted at /media.
    STREAMERO_MEDIA_ROOTS: ${STREAMERO_MEDIA_ROOTS:-/media}
    # Media clients (TV apps, Infuse, Swiftfin…) may use the plain server address;
    # "false" keeps their API under /compat only (docs/INTEGRATIONS.md, D-032).
    STREAMERO_COMPAT_ROOT: ${STREAMERO_COMPAT_ROOT:-true}
    # Answer the TV apps' "find servers on my network" broadcast on UDP 7359 (D-033).
    STREAMERO_DISCOVERY: ${STREAMERO_DISCOVERY:-true}
    # Address announced to discovering apps, e.g. http://192.168.1.10:8787. Set it with
    # bridge networking: the container only knows its own internal address.
    STREAMERO_DISCOVERY_URL: ${STREAMERO_DISCOVERY_URL:-}
    # DLNA media server for smart TVs (D-038). The listeners start with the server;
    # nothing is served until an admin turns DLNA on in Settings → Server and picks
    # the user it acts as. "false" does not even open the ports.
    STREAMERO_DLNA: ${STREAMERO_DLNA:-true}
    # Address announced to TVs, e.g. http://192.168.1.10:8788. Needed with bridge
    # networking (the container only knows its internal address).
    STREAMERO_DLNA_URL: ${STREAMERO_DLNA_URL:-}
    # Live TV and DVR (D-041): recordings are written here (RECORDINGS_PATH on the host)
    # and appear as the "Recordings" library. M3U/XMLTV files can be put in /config/livetv.
    STREAMERO_RECORDINGS_DIR: ${STREAMERO_RECORDINGS_DIR:-/recordings}
  volumes:
    - ${CONFIG_PATH:-./data/config}:/config
    - ${CACHE_PATH:-./data/cache}:/cache
    - ${MEDIA_PATH:-/mnt/media}:/media:ro
    # DVR recordings (D-041); the worker scans them into the recordings library.
    - ${RECORDINGS_PATH:-./data/recordings}:/recordings
  depends_on:
    db: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  # Docker creates missing bind-mount dirs as root; the app runs as uid 1000.
  init:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown 1000:1000 /config /cache /recordings"]
    volumes:
      - ${CONFIG_PATH:-./data/config}:/config
      - ${CACHE_PATH:-./data/cache}:/cache
      - ${RECORDINGS_PATH:-./data/recordings}:/recordings

  streamero:
    <<: *common
    command: ["serve"]
    depends_on:
      init: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-8787}:8787"
      # Client discovery (UDP). Docker bridge networks usually do not pass LAN
      # broadcasts into the container: use `network_mode: host` for discovery to
      # work, or type the server address in the app.
      # Bound to loopback by default; set DISCOVERY_PORT=<lan-ip>:7359 in .env for the LAN.
      - "${DISCOVERY_PORT:-127.0.0.1:7359}:7359/udp"
      # DLNA HTTP side (device description, browsing, media) for TVs on the LAN;
      # it answers only private, loopback and link-local addresses.
      # Bound to loopback by default: behind Docker's bridge every request comes from
      # the bridge gateway (a private address), so the server's LAN-only check cannot
      # tell an Internet client from a TV. Set DLNA_HTTP_PORT=<lan-ip>:8788 in .env.
      - "${DLNA_HTTP_PORT:-127.0.0.1:8788}:8788"
      # DLNA discovery (SSDP) is multicast on UDP 1900, which a bridge network does
      # not pass into the container: TVs find the server only with
      # `network_mode: host` or a macvlan network (docs/INTEGRATIONS.md). Not
      # published by default because many hosts already use UDP 1900 (other DLNA
      # servers, routers' UPnP helpers) and a taken port would stop `compose up`.
      # - "1900:1900/udp"
    volumes:
      - ${CONFIG_PATH:-./data/config}:/config
      - ${CACHE_PATH:-./data/cache}:/cache
      - ${MEDIA_PATH:-/mnt/media}:/media:ro
      - ${RECORDINGS_PATH:-./data/recordings}:/recordings
      - type: tmpfs            # transcode segments live in RAM
        target: /transcode
        tmpfs: { size: 8g, mode: 01777 }
    healthcheck:
      test: ["CMD", "/app/streamero", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *common
    command: ["worker"]
    healthcheck:
      disable: true   # the worker has no HTTP listener; liveness is visible via River job stats
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      streamero: { condition: service_healthy }

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamero
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: streamero
    volumes:
      - ${DB_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamero"]
      interval: 10s
      retries: 5
    shm_size: 256mb

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
